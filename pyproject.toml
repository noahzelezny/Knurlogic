[build-system]
# 77: `license` + `license-files` (PEP 639) need setuptools 77.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "knurlogic"
version = "0.1.2"
description = "Serve local language models on Apple Silicon, for people and agents."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Noah Zelezny" }]
keywords = ["mlx", "apple-silicon", "llm", "inference", "openai", "anthropic",
            "mcp", "local-models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# mlx and mlx-lm are PINNED EXACTLY: the batch engine subclasses mlx-lm's
# BatchGenerator and reads its internals. Move the pin together with the
# digests in [tool.knurlogic.pins] (tests/test_pins.py checks them).
dependencies = [
    "mlx==0.31.2; platform_system == 'Darwin'",
    "mlx-lm==0.31.3",
    # the update check (model_info(expand=, timeout=)) and model downloads
    "huggingface_hub>=0.24",
    "numpy>=1.24",
    # images: decode, EXIF transpose, the pixel hash
    "Pillow>=10.0",
    # the menu-bar icon (`knurlogic ui --no-menubar` opts out)
    "rumps>=0.4; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
knurlogic = "knurlogic.interfaces.cli:main"

[project.urls]
Homepage = "https://github.com/noahzelezny/Knurlogic"
Repository = "https://github.com/noahzelezny/Knurlogic"
Issues = "https://github.com/noahzelezny/Knurlogic/issues"
Changelog = "https://github.com/noahzelezny/Knurlogic/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knurlogic = ["interfaces/page/assets/**/*", "interfaces/menubar_assets/*.png",
             "engine/families/*/architecture/*.md",
             "engine/families/*/architecture/*.json",
             "engine/families/*/vision/PROVENANCE.md",
             "engine/runtime/PROVENANCE.md",
             "engine/templates/*.jinja", "engine/templates/PROVENANCE.md",
             "context_management/prompts/*.md"]

[tool.knurlogic.pins]
# What tests/test_pins.py holds the installed stack to: the versions, and
# sha256 of the two mlx-lm files knurlogic builds on (an edited file is a
# drift even under the same version string).
mlx = "0.31.2"
mlx-lm = "0.31.3"
mlx_lm_generate_sha256 = "270778ad53eaca55a8533d82e6752660fe5d2605c4aa0879b48a50a91f69345f"
mlx_lm_cache_sha256 = "819ed95dcbf755652363cfdb15a639890447abb534a06dcefd52c7fff5055750"

[tool.ruff]
target-version = "py310"
line-length = 88
# Vendored from mlx-lm / mlx-vlm (see NOTICE): kept as upstream wrote it.
extend-exclude = [
    "src/knurlogic/engine/families/*/architecture",
    "src/knurlogic/engine/families/qwen/vision",
    "src/knurlogic/engine/families/gemma4/vision",
    "tests/support/fixtures_deepseek_v4",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = [
    "B905",   # zip(strict=) would change behaviour on uneven inputs
]

[tool.ruff.lint.per-file-ignores]
"src/knurlogic/engine/kvattn.py" = [
    "E501",   # Metal kernel source in a string: C++ lines, not wrapped here
]
"tests/support/fixtures_thunderbolt.py" = [
    "E501",   # captured system_profiler output, kept verbatim
]
"tests/**" = [
    "F811",  # a fixture used as a parameter shadows its own import
    "E731",  # one-line lambda fakes
    "E402",  # imports after sys.path / environment setup
]
"tests/integration/test_peer_launch.py" = [
    "B008",  # Open() is a stateless gate used as a shared default
]

[tool.pytest.ini_options]
# each checkout tests its own src, whatever is installed
# test modules import helpers from sibling test files by bare name
# (test_cluster_jobs, test_batch_drafting, ...): their folders are on the
# path so a file collects alone or in any order
pythonpath = ["src", "tests/support", "tests/cluster", "tests/engine",
              "tests/interfaces"]

[tool.mypy]
python_version = "3.10"
files = ["src/knurlogic"]
ignore_missing_imports = true
# `def f(x: str = None)` is read as Optional[str], as it was before PEP 484
# banned it; spelling out ~30 of these is style churn, not a bug fix.
implicit_optional = true
# mlx ships .pyi stubs; the per-module follow_imports below must reach them.
follow_imports_for_stubs = true
# Vendored from mlx-lm / mlx-vlm (see NOTICE): kept as upstream wrote it.
exclude = [
    "src/knurlogic/engine/families/[^/]+/architecture",
    "src/knurlogic/engine/families/qwen/vision",
    "src/knurlogic/engine/families/gemma4/vision",
]

# Excluded files are still checked when something imports them; silence them.
[[tool.mypy.overrides]]
module = [
    "knurlogic.engine.families.*.architecture",
    "knurlogic.engine.families.*.architecture.*",
    "knurlogic.engine.families.qwen.vision",
    "knurlogic.engine.families.qwen.vision.*",
    "knurlogic.engine.families.gemma4.vision",
    "knurlogic.engine.families.gemma4.vision.*",
]
ignore_errors = true

# mlx and its satellites are typed loosely (mx.array arithmetic, Stream vs
# Device) and each release moves it: see them as Any rather than chase them.
[[tool.mypy.overrides]]
module = ["mlx", "mlx.*", "mlx_lm", "mlx_lm.*", "mlx_vlm", "mlx_vlm.*",
          "huggingface_hub", "huggingface_hub.*", "transformers",
          "transformers.*", "PIL", "PIL.*"]
follow_imports = "skip"
ignore_missing_imports = true
