[build-system]
# 77, not 68: `license = "Apache-2.0"` + `license-files` is PEP 639, which
# setuptools only understands from 77. Declaring 68 made an editable install
# fail metadata generation on a box whose setuptools was 75.1 -- the floor
# has to be the version the metadata actually needs, not the one that was
# current when the file was written.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "knurlogic"
version = "0.1.0.dev0"
description = "Make local model runtimes manageable: resolve settings, verify the environment."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Noah Zelezny" }]

# mlx-lm is the library underneath (model classes, tokenizer, caches,
# BatchGenerator; knurlogic's own server is engine/runtime + interfaces/http).
# PINNED EXACTLY, mlx with it (design D2, docs/design/vision.md): the batch
# engine subclasses BatchGenerator and reads its internals, the vision key
# rides mlx-lm's prompt trie, and v1 of the vision design was built on line
# citations from a different mlx-lm than the one serving (critique B4). A
# version is blessed by re-verifying those (tests/test_pins.py lists them),
# then moving the pin, the digests in
# [tool.knurlogic.pins] and tests/test_pins.py together. 0.31.3 is also the
# oldest release measured to load a VQ artifact's bundled `model_file`.
# The versions are the ones the 166-test suite ran green on, 2026-09-23.
# The VQ runtime's pin (vqlab commit + digest) is P-VQ's, beside engine/vq/.
dependencies = [
    "mlx==0.31.2; platform_system == 'Darwin'",
    "mlx-lm==0.31.3",
    "numpy>=1.24",
    # Images (engine/vision/images.py): decode, EXIF transpose, the pixel
    # hash. Tested at 12.2.0; the floor is the API it uses, not a measured
    # oldest-good release.
    "Pillow>=10.0",
]

[project.scripts]
knurlogic = "knurlogic.interfaces.cli:main"

[project.urls]
Homepage = "https://github.com/noahzelezny/knurlogic"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knurlogic = ["interfaces/web/*.html", "interfaces/web/*.md",
             "engine/families/*/architecture/*.md",
             "engine/families/*/architecture/*.json",
             "engine/vq/*.json", "engine/vq/*.md",
             "engine/families/*/vision/PROVENANCE.md"]

[tool.knurlogic.pins]
# One home for the facts tests/test_pins.py holds the installed stack to.
# sha256 of the mlx-lm 0.31.3 files knurlogic builds on as a library:
# generate.py (MTPBatchGenerator subclasses BatchGenerator and reads its
# queue and response shapes) and models/cache.py (LRUPromptCache, whose
# order the image pins read). An edited file is a drift even under the
# same version string (a local patch, a fork installed as 0.31.3).
# mlx-lm's server.py is not used (docs/SERVER.md).
mlx = "0.31.2"
mlx-lm = "0.31.3"
mlx_lm_generate_sha256 = "270778ad53eaca55a8533d82e6752660fe5d2605c4aa0879b48a50a91f69345f"
mlx_lm_cache_sha256 = "819ed95dcbf755652363cfdb15a639890447abb534a06dcefd52c7fff5055750"
