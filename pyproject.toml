[build-system]
# 77: `license` + `license-files` (PEP 639) need setuptools 77.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "knurlogic"
version = "0.1.8"
description = "Serve local language models on Apple Silicon, for people and agents."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Noah Zelezny" }]
keywords = ["mlx", "apple-silicon", "llm", "inference", "openai", "anthropic",
            "mcp", "local-models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# mlx and mlx-lm are PINNED EXACTLY: the batch engine subclasses mlx-lm's
# BatchGenerator and reads its internals. Move the pin together with the
# digests in [tool.knurlogic.pins] (tests/test_pins.py checks them).
dependencies = [
    "mlx==0.32.3; platform_system == 'Darwin'",
    "mlx-lm==0.32.0",
    # the update check (model_info(expand=, timeout=)) and model downloads
    "huggingface_hub>=0.24",
    "numpy>=1.24",
    # images: decode, EXIF transpose, the pixel hash
    "Pillow>=10.0",
    # the menu-bar icon (`knurlogic ui --no-menubar` opts out)
    "rumps>=0.4; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "ruff>=0.16,<0.17", "mypy", "pylint"]

[project.scripts]
knurlogic = "knurlogic.interfaces.cli:main"

[project.urls]
Homepage = "https://github.com/noahzelezny/Knurlogic"
Repository = "https://github.com/noahzelezny/Knurlogic"
Issues = "https://github.com/noahzelezny/Knurlogic/issues"
Changelog = "https://github.com/noahzelezny/Knurlogic/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knurlogic = ["interfaces/page/assets/**/*", "interfaces/menubar_assets/*.png", "interfaces/menubar_assets/*.svg",
             "engine/families/*/architecture/*.md",
             "engine/families/*/architecture/*.json",
             "engine/families/*/vision/PROVENANCE.md",
             "engine/runtime/PROVENANCE.md",
             "engine/families/*/templates/*.jinja",
             "engine/families/*/templates/PROVENANCE.md",
             "context_management/prompts/*.md"]

[tool.knurlogic.pins]
# What tests/test_pins.py holds the installed stack to: the versions, and
# sha256 of the two mlx-lm files knurlogic builds on (an edited file is a
# drift even under the same version string).
mlx = "0.32.3"
mlx-lm = "0.32.0"
mlx_lm_generate_sha256 = "4a3bf57f5679dac73791f069268866ab5b9336e58582d436b31133984e4b6971"
mlx_lm_cache_sha256 = "c96cb169fd5e0ec4584a162dd61dc62ab08ccdca03a9850f8a491ce6809145e6"

[tool.ruff]
target-version = "py310"
line-length = 88
# Vendored from mlx-lm / mlx-vlm (see NOTICE): kept as upstream wrote it.
extend-exclude = [
    "src/knurlogic/engine/families/*/architecture",
    "src/knurlogic/engine/families/qwen/vision",
    "src/knurlogic/engine/families/gemma4/vision",
    "tests/support/fixtures_deepseek_v4",
    "tests/support/fixtures_deepseek_v4_vision/encoding_dsv4.py",
]

[tool.ruff.lint]
# Correctness (E, F, W, B), imports (I), modern syntax (UP) and the families that
# catch unpythonic or redundant code (SIM, C4, RET, PIE, PTH, ARG, PERF, FURB,
# RUF, PL). Rules that still had hits on 2026-10-14 are listed under
# extend-per-file-ignores so `ruff check` on the tree stays green;
# tests/integration/test_quality.py counts them with that list switched off and
# fails if any count rises. When a rule reaches zero, delete it from both.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RET", "PIE", "PTH", "ARG", "PERF", "FURB", "RUF", "PL"]
ignore = [
    "PLR0913",  # too many arguments: a signature is reviewed, not counted
    "PLR0917",  # too many positional arguments: same
    "PLR2004",  # magic value in comparison: named constants carry the unit instead
    "PLC0415",  # import inside a function: lazy imports are deliberate here (optional deps, cycles)
    "B905",   # zip(strict=) would change behaviour on uneven inputs
]

[tool.ruff.lint.per-file-ignores]
"src/knurlogic/engine/kvattn.py" = [
    "E501",   # Metal kernel source in a string: C++ lines, not wrapped here
]
"tests/support/fixtures_thunderbolt.py" = [
    "E501",   # captured system_profiler output, kept verbatim
]
"tests/**" = [
    "ARG",   # fixtures and fakes take parameters they do not use
    "F811",  # a fixture used as a parameter shadows its own import
    "E731",  # one-line lambda fakes
    "E402",  # imports after sys.path / environment setup
]
"tests/integration/test_peer_launch.py" = [
    "B008",  # Open() is a stateless gate used as a shared default
]

[tool.ruff.lint.extend-per-file-ignores]
# Ratchet baseline (2026-10-14): rules with pre-existing hits. Only shrinks.
"*" = [
