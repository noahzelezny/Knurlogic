[build-system]
# 77, not 68: `license = "Apache-2.0"` + `license-files` is PEP 639, which
# setuptools only understands from 77. Declaring 68 made an editable install
# fail metadata generation on a box whose setuptools was 75.1 -- the floor
# has to be the version the metadata actually needs, not the one that was
# current when the file was written.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "knurlogic"
version = "0.1.0.dev0"
description = "Make local model runtimes manageable: resolve settings, verify the environment."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Noah Zelezny" }]

# mlx-lm is the engine (see knurlogic/engine/seam.py, the one module that knows
# so). PINNED EXACTLY, mlx with it (design D2, docs/design/vision.md): the
# seam wraps mlx-lm's server methods by name (`ResponseGenerator._tokenize`,
# `_serve_single`, the prompt cache), the vision key rides mlx-lm's prompt
# trie, and v1 of the vision design was built on line citations from a
# different mlx-lm than the one serving (critique B4). A version is blessed
# by re-verifying those wraps, then moving the pin, the digest in
# [tool.knurlogic.pins] and tests/test_pins.py together. 0.31.3 is also the
# oldest release measured to load a VQ artifact's bundled `model_file`.
# The versions are the ones the 166-test suite ran green on, 2026-09-23.
# The VQ runtime's pin (vqlab commit + digest) is P-VQ's, beside engine/vq/.
dependencies = [
    "mlx==0.31.2; platform_system == 'Darwin'",
    "mlx-lm==0.31.3",
    "numpy>=1.24",
    # Images (engine/vision/images.py): decode, EXIF transpose, the pixel
    # hash. Tested at 12.2.0; the floor is the API it uses, not a measured
    # oldest-good release.
    "Pillow>=10.0",
]

[project.optional-dependencies]
# Multimodal architectures (glm5_next) are looked up in mlx_vlm, not mlx_lm.
vlm = ["mlx-vlm>=0.7.1"]

[project.scripts]
knurlogic = "knurlogic.interfaces.cli:main"

[project.urls]
Homepage = "https://github.com/noahzelezny/knurlogic"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# `overrides/` is NOT a python package -- it has no __init__.py, because its
# contents are files served in front of OTHER packages' modules, not imports
# of ours. So every one of them has to be declared as package data or it
# silently does not ship, and `pip install knurlogic` hands the user an
# installer that is not there. Recursive, since a real override mirrors its
# target's path: overrides/exo/master/placement_utils.py.
knurlogic = ["interfaces/web/*.html", "interfaces/web/*.md",
             "engine/families/*/architecture/*.md",
             "engine/families/*/architecture/*.json",
             "engine/overrides/*.py", "engine/overrides/*.md",
             "engine/overrides/*.json", "engine/overrides/**/*.py",
             "engine/overrides/**/*.json",
             "engine/vq/*.json", "engine/vq/*.md",
             "engine/families/*/vision/PROVENANCE.md"]

[tool.knurlogic.pins]
# One home for the facts tests/test_pins.py holds the installed stack to.
# sha256 of mlx_lm/server.py at mlx-lm 0.31.3: the seam wraps its methods,
# so an edited server.py is a drift even under the same version string
# (a local patch, a fork installed as 0.31.3).
mlx = "0.31.2"
mlx-lm = "0.31.3"
mlx_lm_server_sha256 = "cdfcb4ac848636f9927851a0ec7a951584526530cb7832ba58049e4a9144db8b"
