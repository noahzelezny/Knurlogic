[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knurlogic"
version = "0.1.0.dev0"
description = "Make local model runtimes manageable: resolve settings, verify the environment."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Noah Zelezny" }]

[project.scripts]
knurlogic = "knurlogic.doctor:main"

[project.urls]
Homepage = "https://github.com/noahzelezny/knurlogic"

[tool.setuptools.packages.find]
where = ["src"]
