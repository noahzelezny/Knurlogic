[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knurlogic"
version = "0.1.0.dev0"
description = "Make local model runtimes manageable: resolve settings, verify the environment."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Noah Zelezny" }]

# mlx-lm is the engine (see knurlogic/engine.py, the one module that knows
# so). Floor is 0.31.3: that is the oldest PyPI release measured to load a
# VQ artifact's bundled `model_file` and generate coherent text with the
# vendored architectures. No upper pin -- newer releases are the thing this
# package exists to keep up with, and `knurlogic smoke --pin` is how a
# version gets blessed.
dependencies = [
    "mlx-lm>=0.31.3",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Multimodal architectures (glm5_next) are looked up in mlx_vlm, not mlx_lm.
vlm = ["mlx-vlm>=0.7.1"]

[project.scripts]
knurlogic = "knurlogic.cli:main"

[project.urls]
Homepage = "https://github.com/noahzelezny/knurlogic"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knurlogic = ["web/*.html", "architectures/*.md", "architectures/*.json"]
