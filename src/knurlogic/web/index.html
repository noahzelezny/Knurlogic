<!doctype html><meta charset="utf-8"><title>knurlogic</title>

<style>
 /* Exo's dashboard is a COMMAND CENTER: neutral dark greys in oklch, one
    saturated accent, monospace everywhere, and panels that read as lit
    instrument faces rather than cards. Its own app.css is the source for
    every number below -- bg 0.12, card 0.16, border 0.22, muted text 0.6,
    radius 0.375rem, 40px grid, 6px scrollbars, 0.02em body tracking.
    The one deliberate departure is the hue: teal, not yellow. */
 :root{
   --bg:oklch(.12 0 0);--panel:oklch(.16 0 0);--med:oklch(.22 0 0);
   --fg:oklch(.9 0 0);--dim:oklch(.6 0 0);--faint:oklch(.45 0 0);
   --line:oklch(.25 0 0);--grid:oklch(.2 0 0/.3);
   --ok:oklch(.78 .15 150);--warn:oklch(.78 .15 70);
   --acc:oklch(.82 .14 185);--accfg:oklch(.14 .02 185);
   --glow:0 0 20px oklch(.82 .14 185/.3);
   --r:.375rem}
 /* Light mode is not exo's -- exo is dark only -- but a page that blinds
    someone at a bright desk is not usable, whatever it looks like. */
 @media(prefers-color-scheme:light){:root{
   --bg:oklch(.97 0 0);--panel:oklch(1 0 0);--med:oklch(.93 0 0);
   --fg:oklch(.2 0 0);--dim:oklch(.45 0 0);--faint:oklch(.6 0 0);
   --line:oklch(.89 0 0);--grid:oklch(.8 0 0/.35);
   --ok:oklch(.5 .14 150);--warn:oklch(.55 .13 70);
   --acc:oklch(.55 .11 185);--accfg:oklch(1 0 0);--glow:none}}
 *{box-sizing:border-box}
 body{margin:0;min-width:940px;background:var(--bg);color:var(--fg);
   letter-spacing:.02em;
   font:13px/1.6 'SF Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,
     'DejaVu Sans Mono',monospace;
   background-image:linear-gradient(var(--grid) 1px,transparent 1px),
     linear-gradient(90deg,var(--grid) 1px,transparent 1px);
   background-size:40px 40px;background-attachment:fixed}
 /* The CRT scanline, at exo's exact period. It is the cheapest single thing
    that makes a dark panel read as a screen instead of a div. */
 body:before{content:'';position:fixed;inset:0;pointer-events:none;z-index:100;
   background:repeating-linear-gradient(0deg,transparent,transparent 2px,
     oklch(0 0 0/.03) 2px,oklch(0 0 0/.03) 4px)}
 ::-webkit-scrollbar{width:6px;height:6px}
 ::-webkit-scrollbar-track{background:oklch(.1 0 0)}
 ::-webkit-scrollbar-thumb{background:oklch(.3 0 0);border-radius:3px}
 ::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--acc) 50%,transparent)}
 a{color:inherit;text-decoration:none}
 /* --- masthead: a wordmark, and the nav exo puts opposite it -------------- */
 header{border-bottom:1px solid var(--line);padding:14px 24px;display:grid;
   grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;
   background:linear-gradient(180deg,oklch(.16 0 0/.95),oklch(.12 0 0/.98));
   position:sticky;top:0;z-index:20;backdrop-filter:blur(6px)}
 @media(prefers-color-scheme:light){header{
   background:linear-gradient(180deg,oklch(1 0 0/.95),oklch(.97 0 0/.98))}}
 /* exo centres its logo and pins everything else to the edges. */
 header>.live{justify-self:start}
 header>nav{justify-self:end}
 .mark{position:relative;display:flex;align-items:center;justify-content:center;
   justify-self:center}
 .mark b{font-size:19px;font-weight:700;letter-spacing:.22em;
   text-transform:uppercase;text-shadow:var(--glow);position:relative;z-index:1}
 /* Taller than the bar: the teeth are meant to break its top and bottom
    edge, which is the whole reason it is a wheel and not a bullet point. */
 .wheel{position:absolute;left:50%;top:50%;width:72px;height:72px;
   transform:translate(-50%,-50%);pointer-events:none;overflow:visible}

 /* exo's data-readout: 11px, uppercase, wide tracking. Small text on this
    page is an INSTRUMENT LABEL, never prose. */
 .ro{font-size:11px;letter-spacing:.05em;text-transform:uppercase}
 .live{display:flex;align-items:center;gap:7px;color:var(--dim)}
 .live i{width:7px;height:7px;border-radius:50%;background:var(--ok);
   box-shadow:0 0 8px currentColor;animation:pulse 2s ease-in-out infinite}
 .live.off i{background:var(--warn);animation:none}
 @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
 nav{display:flex;gap:20px;font-size:11px;letter-spacing:.16em;
   text-transform:uppercase;color:var(--dim)}
 nav a:hover{color:var(--acc)}
 .wrap{max-width:1240px;margin:0 auto;padding:22px 24px 60px}
 /* Chat memory on the left, the way exo keeps it. */
 /* Two layouts, both of them desktop: three columns, and the same three
    with the model rail dropped underneath for a window shoved to half a
    screen. Below that the page scrolls sideways like any other desktop
    app rather than pretending to be a phone. */
 .app{display:grid;grid-template-columns:200px 1fr 260px;gap:24px;
   align-items:start}
 @media(max-width:1180px){.app{grid-template-columns:200px 1fr}
   .right{grid-column:1/-1;order:3}
   .right .panel{max-width:none}}
 .right{min-width:0}
 .right .panel{margin-bottom:0}
 .loaded .nm{font-size:13px;font-weight:700;letter-spacing:.02em;
   word-break:break-word}
 .loaded .msg{margin-top:3px}
 .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
 .badge{font-size:9px;letter-spacing:.1em;text-transform:uppercase;
   border:1px solid var(--line);color:var(--dim);padding:1px 5px;border-radius:2px}
 .badge.on{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
 /* Other models are shown, never switched to: a loaded model is loaded.
    What is on offer is the command that would serve one. */
 .other{padding:7px 0;border-top:1px solid var(--line);cursor:pointer}
 .other:first-child{border-top:0}
 .other .n{font-size:11.5px;white-space:nowrap;overflow:hidden;
   text-overflow:ellipsis;color:var(--dim)}
 .other:hover .n{color:var(--fg)}
 .other .s{font-size:10px;color:var(--faint);letter-spacing:.04em;margin-top:2px}
 .other.no .n{color:var(--faint)}
 .other pre{margin:7px 0 2px;font-size:10px;user-select:all;
   background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
   padding:7px 8px;white-space:pre-wrap;word-break:break-all}
 .side{border-right:1px solid var(--line);padding-right:18px;min-width:0}
 .newchat{width:100%;text-align:left;color:var(--acc);border-style:dashed;
   cursor:pointer;margin-bottom:12px;font-size:11.5px;letter-spacing:.08em;
   text-transform:uppercase}
 .newchat:hover{border-color:var(--acc)}
 .chat{padding:8px 9px;border-radius:var(--r);cursor:pointer;margin-bottom:3px;
   border:1px solid transparent}
 .chat:hover{background:var(--med)}
 .chat[aria-current=true]{border-color:color-mix(in srgb,var(--acc) 40%,transparent);
   background:color-mix(in srgb,var(--acc) 8%,transparent)}
 .chat .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
 .chat .m{font-size:10px;color:var(--faint);letter-spacing:.04em;margin-top:3px}
 .chat .x{float:right;color:var(--faint);padding:0 2px;visibility:hidden}
 .chat:hover .x{visibility:visible}
 .chat .x:hover{color:var(--warn)}
 .sidelab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;
   color:var(--faint);margin:14px 0 7px}
 /* A menu takes the whole screen. Half a screen of settings beside a
    topology you are not reading is two things competing; this is one. */
 .sheet{position:fixed;inset:0;z-index:40;background:var(--bg);
   display:flex;flex-direction:column;
   background-image:linear-gradient(var(--grid) 1px,transparent 1px),
     linear-gradient(90deg,var(--grid) 1px,transparent 1px);
   background-size:40px 40px}
 .sheet[hidden]{display:none}
 .sheethd{display:flex;align-items:center;justify-content:space-between;
   padding:16px 24px;border-bottom:1px solid var(--line);flex:none;
   background:linear-gradient(180deg,oklch(.16 0 0/.95),oklch(.12 0 0/.98))}
 @media(prefers-color-scheme:light){.sheethd{
   background:linear-gradient(180deg,oklch(1 0 0/.95),oklch(.97 0 0/.98))}}
 .sheethd b{letter-spacing:.18em;color:var(--acc);text-shadow:var(--glow)}
 #sheetclose{background:transparent;border-color:var(--line);color:var(--dim);
   cursor:pointer;letter-spacing:.1em}
 #sheetclose:hover{color:var(--fg);border-color:var(--acc)}
 .sheetbody{overflow:auto;padding:26px 24px 60px}
 .sheetbody .panel{max-width:760px;margin:0 auto 20px}
 .sheetbody .panel{display:none}
 .sheetbody .panel.on{display:block}
 /* The sheet header already names the panel; the notch label would say it
    a second time, six lines lower. */
 .sheetbody .panel>.lab{display:none}
 .sheetbody .panel{padding-top:20px}
 nav a[aria-pressed=true]{color:var(--acc)}
 nav a{cursor:pointer;border-bottom:1px solid transparent;padding-bottom:2px}
 nav a[aria-pressed=true]{border-bottom-color:var(--acc)}
 nav a[aria-pressed=true]{text-shadow:var(--glow)}
 .panel{border:1px solid var(--line);border-radius:var(--r);
   padding:16px 18px 18px;position:relative;margin-bottom:20px;
   background:linear-gradient(180deg,oklch(.16 0 0/.95) 0%,oklch(.12 0 0/.98) 100%);
   box-shadow:inset 0 1px 0 oklch(1 0 0/.03),0 4px 20px oklch(0 0 0/.5)}
 @media(prefers-color-scheme:light){.panel{background:var(--panel);
   box-shadow:0 1px 3px oklch(0 0 0/.07)}}
 .lab{position:absolute;top:-7px;left:14px;background:var(--bg);padding:0 7px;
   font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--acc);
   font-weight:700}
 .lab:before{content:"\25c6  "}
 .row{display:flex;justify-content:space-between;gap:14px;padding:3px 0}
 .row>span:first-child{color:var(--dim)}
 /* --- topology: the device IS the gauge ---------------------------------- */
 /* exo draws the topology on a round CRT face -- a radial gradient with a
    heavy inner shadow, so the devices sit INSIDE a screen rather than on a
    background. The graph links are dashed and animate along their length,
    which is the one piece of motion that carries information: it says the
    link is live. */
 .topo{display:flex;align-items:center;justify-content:center;gap:0;
   flex-wrap:wrap;padding:26px 10px 18px;margin:2px 0 4px;border-radius:var(--r);
   background:radial-gradient(ellipse at center,oklch(.16 0 0) 0%,
     oklch(.12 0 0) 50%,oklch(.09 0 0) 100%);
   box-shadow:inset 0 0 70px oklch(0 0 0/.5),0 0 40px oklch(.82 .14 185/.06)}
 @media(prefers-color-scheme:light){.topo{background:var(--med);box-shadow:none}}
 .flow{width:56px;height:20px;flex:none}
 .flow line{stroke:color-mix(in srgb,var(--acc) 40%,transparent);stroke-width:1.5;
   stroke-dasharray:8 8;animation:flow 1s linear infinite;
   filter:drop-shadow(0 0 3px color-mix(in srgb,var(--acc) 50%,transparent))}
 @keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-16}}

 .unit{text-align:center;padding:0 10px}
 .unit .nm{font-size:11.5px;letter-spacing:.08em;margin-bottom:8px;color:var(--dim)}
 .unit .stat{font-size:10.5px;color:var(--faint);margin-top:7px;letter-spacing:.04em}
 .unit .pct{font-size:15px;font-weight:700;color:var(--acc);
   text-shadow:var(--glow)}
 /* The free-space bar is gone. It was a third telling of a number the
    device gauges already draw and then print: a full-width chart that said
    less than the 66% next to the machine it belongs to, and cost more
    vertical room than the machines did. What is left is one summary line. */
 #mem{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;
   color:var(--dim);padding-top:12px}
 #mem b{color:var(--fg);font-weight:700}
 /* --- controls ----------------------------------------------------------- */
 .seg{display:inline-flex;border:1px solid var(--line);overflow:hidden;
   border-radius:var(--r);background:var(--bg)}
 .seg button{border:0;border-radius:0;background:transparent;color:var(--dim);
   padding:7px 14px;font:inherit;font-size:11.5px;letter-spacing:.1em;
   text-transform:uppercase;cursor:pointer}
 .seg button[aria-pressed=true]{background:var(--acc);color:var(--accfg);font-weight:700}
 .ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
 .ctl label{color:var(--faint);font-size:11px;letter-spacing:.06em}
 input,button{font:inherit;border:1px solid var(--line);padding:6px 10px;
   background:var(--bg);color:var(--fg);border-radius:var(--r)}
 input:focus{outline:none;border-color:var(--acc)}
 #ws{width:64px;text-align:right}
 .go{background:var(--acc);color:var(--accfg);border-color:transparent;font-weight:700;
   letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
   box-shadow:var(--glow)}
 .go[disabled]{box-shadow:none}
 .go[disabled]{opacity:.3;cursor:default}
 .dials{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;margin:16px 0 4px}
 .dial{text-align:center;width:118px;-webkit-user-select:none;user-select:none}
 .dial svg{cursor:ns-resize;touch-action:none;display:block;margin:0 auto;
   border-radius:50%;background:radial-gradient(circle at 50% 38%,
     oklch(.2 0 0) 0%,oklch(.13 0 0) 70%,oklch(.1 0 0) 100%);
   box-shadow:inset 0 1px 0 oklch(1 0 0/.05),0 2px 8px oklch(0 0 0/.5)}
 @media(prefers-color-scheme:light){.dial svg{background:var(--med);
   box-shadow:inset 0 1px 2px oklch(0 0 0/.12)}}
 .dial .nm{font-size:10px;color:var(--faint);margin-top:7px;letter-spacing:.1em;
   text-transform:uppercase}
 .dial .vv{font-size:15px;font-weight:700;margin-top:5px;text-shadow:var(--glow)}
 .dial .vv em{font-style:normal;font-size:10.5px;color:var(--dim);font-weight:400}
 .pend{color:var(--acc)}
 .capnote{font-size:10.5px;color:var(--warn);margin-top:6px;text-align:center}
 .knob{padding:6px 0;border-top:1px solid var(--line);cursor:pointer}
 .knob:first-child{border-top:0}
 .knob .hd{display:flex;justify-content:space-between;gap:12px}
 .knob .why{color:var(--dim);font-size:11px;margin-top:4px;display:none}
 .knob[open] .why{display:block}
 .val{font-size:12px;white-space:nowrap}
 .was{color:var(--faint);text-decoration:line-through;margin-right:6px}
 .chg{color:var(--acc);font-weight:700}
 .tag{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
   border:1px solid var(--line);padding:0 4px;margin-left:7px}
 .tag.live{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
 .tag.dead{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
 .msg{color:var(--dim);font-size:11.5px;margin-top:10px}
 .msg b{color:var(--fg)}
 code{font-size:11.5px}
 details.more{margin-top:10px}
 details.more summary{cursor:pointer;color:var(--faint);font-size:11px;list-style:none}
 details.more summary::-webkit-details-marker{display:none}
 details.more summary:before{content:"+ "}
 details.more[open] summary:before{content:"\2212 "}
 pre{margin:8px 0 0;font-size:11px;color:var(--dim);white-space:pre-wrap;
   line-height:1.75}
 #log{height:200px;overflow:auto;border:1px solid var(--line);padding:12px;
   background:oklch(.1 0 0);border-radius:var(--r)}
 @media(prefers-color-scheme:light){#log{background:var(--bg)}}
 #log p{margin:0 0 10px;white-space:pre-wrap;word-wrap:break-word}
 #log b{color:var(--acc)}
 /* The numbers are the point of this panel, so they are not a tooltip. */
 .met{display:flex;gap:16px;flex-wrap:wrap;margin:-4px 0 12px;
   font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
   color:var(--faint)}
 .met b{color:var(--fg);font-weight:700;text-transform:none;letter-spacing:0}
 .met .warnv b{color:var(--warn)}
 .met .d{font-style:normal;margin-left:6px;font-weight:700}
 .met .d.up{color:var(--ok)} .met .d.down{color:var(--warn)}
 .met .d.flat{color:var(--faint)}
 #log{height:230px}
 .bench{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:10px}
 .chk{display:flex;align-items:center;gap:7px;cursor:pointer;color:var(--dim);
   font-size:11px;letter-spacing:.06em;text-transform:uppercase}
 .chk input{width:13px;height:13px;accent-color:var(--acc);padding:0;cursor:pointer}
 .mini{background:transparent;color:var(--dim);border-color:var(--line);
   cursor:pointer;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
   padding:5px 11px}
 .mini:hover:not([disabled]){color:var(--acc);border-color:var(--acc)}
 .mini[disabled]{opacity:.35;cursor:default}
 .bench .msg{margin:0;font-size:11px}
 form{display:flex;gap:8px;margin-top:10px}form input{flex:1}
 @media(prefers-reduced-motion:reduce){
   .flow line,.live i{animation:none}
   *,*:before,*:after{transition-duration:.01ms!important;
     animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
<header>
  <div class="live ro" id="state"><i></i><span>connecting</span></div>
  <!-- The mark is a knurl: the crosshatch cut into a machined part so a hand
       can grip it. The wheel sits BEHIND the word with its teeth showing
       above and below, so the name reads as something you turn. -->
  <div class="mark">
    <svg class="wheel" viewBox="0 0 120 120" aria-hidden="true">
      <g id="knurl"></g>
    </svg>
    <b>knurlogic</b>
  </div>
  <nav>
    <a data-panel="settings">Settings</a>
    <a data-panel="connect">Connect</a>
    <a href="/status.json">Status.json</a>
  </nav>
</header>
<div class="wrap">
  <div class="app">
    <!-- Chat memory, as exo keeps it: a list on the left you can go back to.
         It lives in this browser and nowhere else -- runs are kept so a knob
         change can be compared against the last one, which is the whole job
         of this page. -->
    <aside class="side">
      <button class="newchat" id="newchat">+ New run</button>
      <div id="chats"></div>
    </aside>
    <main>
      <section class="panel" id="memory">
        <div class="lab">Memory</div>
        <div class="topo" id="topo"></div>
        <div id="mem" class="ro"></div>
      </section>
      <section class="panel" id="try">
        <div class="lab">Bench</div>
        <div id="log"></div>
        <form id="f"><input id="q" placeholder="A prompt to measure with" autocomplete="off">
          <button class="go" id="go">Run</button></form>
        <div class="bench">
          <button id="again" class="mini" disabled>Run it again</button>
          <label class="chk"><input type="checkbox" id="fresh" checked>
            fresh prefill</label>
        </div>
      </section>
    </main>
    <aside class="right">
      <section class="panel" id="modelpanel">
        <div class="lab">Model</div>
        <div class="loaded">
          <div class="nm" id="title">—</div>
          <div class="msg" id="sub">loading…</div>
          <div id="badges" class="badges"></div>
        </div>
        <div class="sidelab">also on this machine</div>
        <div id="others"></div>
      </section>
    </aside>
  </div>
</div>
<!-- The menus take the whole screen. They are what you came for when they
     are open, and the topology behind them is not something you need to
     watch while reading why a flag is set the way it is. -->
<div class="sheet" id="sheet" hidden>
  <div class="sheethd">
    <b class="ro" id="sheettitle"></b>
    <button id="sheetclose" class="ro">Close  esc</button>
  </div>
  <div class="sheetbody">
      <section class="panel" id="settings">
        <div class="lab">Settings</div>
        <div class="ctl">
          <span class="seg" id="tunes"></span>
          <label>ws <input id="ws" type="number" min="0" step="1"></label>
          <button class="go" id="apply" disabled>Apply</button>
        </div>
        <div class="dials" id="dials"></div>
        <div id="dialnotes"></div>
        <div class="msg" id="applies"></div>
        <div id="knobs" style="margin-top:12px"></div>
        <details class="more"><summary>measured flags</summary><div id="rest"></div></details>
        <details class="more" id="unmanaged"></details>
        <details class="more"><summary>exports</summary><pre id="env"></pre></details>
      </section>
      <section class="panel" id="connect">
        <div class="lab">Connect</div>

        <div class="seg" id="conntabs" style="margin:10px 0"></div>
        <pre id="conn" style="user-select:all"></pre>
      </section>
  </div>
</div>
<script>
// --- the menu -------------------------------------------------------------
// Settings are a thing you go and get, and when you get them they take the
// screen. The page therefore always OPENS closed. An earlier version
// remembered the last panel in localStorage, which quietly undid the point:
// open it once and it is open forever after.
(()=>{
  const sheet=document.getElementById('sheet');
  const links=[...document.querySelectorAll('nav a[data-panel]')];
  function show(name){
    const on=name && document.getElementById(name);
    sheet.hidden=!on;
    document.querySelectorAll('.sheetbody .panel').forEach(p=>
      p.classList.toggle('on', p.id===name));
    document.getElementById('sheettitle').textContent=name||'';
    links.forEach(a=>a.setAttribute('aria-pressed', a.dataset.panel===name));
    document.body.style.overflow=on?'hidden':'';
    if(on) sheet.querySelector('.sheetbody').scrollTop=0;
  }
  links.forEach(a=>a.onclick=()=>show(
    a.getAttribute('aria-pressed')==='true' ? null : a.dataset.panel));
  document.getElementById('sheetclose').onclick=()=>show(null);
  addEventListener('keydown',e=>{ if(e.key==='Escape') show(null) });
  show(null);
  window.knShow=show;
})();

// The knurled wheel, drawn rather than shipped as an image so the page stays
// one file. Teeth are trapezoids around the rim -- a knurl has flanks, and a
// ring of plain radial lines reads as a sun, not as something you grip.
//
// The word covers the wheel's middle, so the teeth that matter are the ones
// at the top and bottom of the circle. Those are the only part visible, and
// they are what makes the name sit ON a wheel rather than beside an icon.
(()=>{
  const g=document.getElementById('knurl'); if(!g) return;
  const cx=60, cy=60, r0=40, r1=56, n=12, half=(180/n)*0.52;
  // The band the word passes through. The wheel is MASKED out across it
  // rather than drawn behind it: a rim crossing the letters is clutter, and
  // the point is that the word is the axle the teeth turn around.
  let out=`<defs><mask id="wm" maskUnits="userSpaceOnUse"
      x="-40" y="-40" width="200" height="200">
      <rect x="-40" y="-40" width="200" height="200" fill="#fff"/>
      <rect x="-40" y="${cy-21}" width="200" height="42" fill="#000"/>
    </mask></defs><g mask="url(#wm)">`;
  for(let i=0;i<n;i++){
    const a=(360/n)*i, p=[];
    for(const [rad,off] of [[r0,-half*1.55],[r1,-half],[r1,half],[r0,half*1.55]]){
      const t=(a+off)*Math.PI/180;
      p.push(`${(cx+rad*Math.sin(t)).toFixed(2)},${(cy-rad*Math.cos(t)).toFixed(2)}`);
    }
    out+=`<polygon points="${p.join(' ')}" fill="var(--acc)" opacity=".6"/>`;
  }
  out+=`<circle cx="${cx}" cy="${cy}" r="${r0}" fill="none"
        stroke="var(--acc)" stroke-width="3" opacity=".6"/></g>`;
  g.innerHTML=out;
})();

const GIB=1073741824, $=id=>document.getElementById(id);
let LASTWS=0;   // this box's working set, learned from the first status
const gb=b=>Number.isFinite(b)?(b/GIB).toFixed(1)+' GiB':'--';
const row=(k,v)=>`<div class="row"><span>${k}</span><span>${v}</span></div>`;
const esc=s=>String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

// --- settings -------------------------------------------------------------
// Three things kept apart: what is RUNNING, what a tune WOULD give, and how
// far a change can reach. Reach is per knob and was measured by reading a
// bundled runtime: two apply live, eight are compiled into the kernel at
// import, and one is not read by these runtimes at all.
let DOC={}, ASK={};
function knobHTML(k){
  const v=k.changed
    ? `<span class="was">${esc(k.running)}</span><span class="chg">${esc(k.would_be)}</span>`
    : esc(k.running??k.would_be);
  const tag=k.reach==='live'?'<span class="tag live">live</span>'
    :k.reach==='no-effect'?'<span class="tag dead">no effect</span>':'';
  return `<div class="knob" onclick="this.toggleAttribute('open')">
    <div class="hd"><span class="k">${k.name}${tag}</span><span class="val">${v}</span></div>
    <div class="why">${esc(k.what)}${k.why?' — '+esc(k.why):''}
      <br><span style="color:var(--faint)">${esc(k.reach_why)}</span></div></div>`;
}
// A knurl is the crosshatch cut into metal so a hand can grip a machined
// part, so the control is a knob with a knurled rim rather than a slider.
// It is not decoration: the positions are DISCRETE because the measurements
// are, and the rim stops turning where the evidence stops -- 32 on the decode
// chunk because nothing above it was ever faster, and at whatever the box's
// headroom allows for the cache. A control that lets you choose a setting the
// resolver would refuse is a control that lies.
const A0=-135, A1=135;                       // sweep, degrees
function dial(k){
  const vals=k.values, idx=Math.max(0,vals.findIndex(v=>String(v)===String(k.running)));
  const capIdx=k.cap==null?vals.length-1:vals.findIndex(v=>String(v)===String(k.cap));
  const ang=i=>A0+(A1-A0)*(vals.length<2?0:i/(vals.length-1));
  const pt=(a,r)=>[36+r*Math.sin(a*Math.PI/180), 36-r*Math.cos(a*Math.PI/180)];
  let ticks='';
  vals.forEach((v,i)=>{
    const [x1,y1]=pt(ang(i),27), [x2,y2]=pt(ang(i),31);
    const dead=i>capIdx;
    ticks+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${
      dead?'var(--line)':(i<=idx?'var(--acc)':'var(--faint)')}" stroke-width="1.6"
      stroke-linecap="round"/>`;
  });
  let knurl='';                              // the grip itself
  for(let a=-180;a<180;a+=5){
    const [x1,y1]=pt(a,17.5), [x2,y2]=pt(a,22);
    knurl+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"
      stroke="var(--faint)" stroke-width=".85" opacity=".55"/>`;
  }
  const [px,py]=pt(ang(idx),16.5);
  const unit=k.unit?`<em>${esc(k.unit)}</em>`:'';
  const pend=k.changed?`<span class="pend">→ ${esc(k.would_be)}</span>`:'';
  return `<div class="dial" data-name="${esc(k.name)}" data-idx="${idx}"
      data-cap="${capIdx}" tabindex="0">
    <svg viewBox="0 0 72 72" width="94" height="94">
      ${ticks}
      <circle cx="36" cy="36" r="22" fill="color-mix(in srgb,var(--fg) 5%,transparent)"
        stroke="var(--line)"/>
      ${knurl}
      <circle cx="36" cy="36" r="17.5" fill="var(--bg)" stroke="var(--line)"/>
      <line class="ptr" x1="36" y1="36" x2="${px}" y2="${py}" stroke="var(--acc)"
        stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="36" cy="36" r="1.6" fill="var(--faint)"/>
    </svg>
    <div class="vv">${esc(k.running)}${unit} ${pend}</div>
    <div class="nm">${esc(k.name.replace(/^(VQ|VQLAB|KNURLOGIC)_/,''))}</div>
  </div>`;
}
function wireDials(){
  // Mutate the live node, never re-render it mid-gesture. Replacing the
  // element with outerHTML destroyed the very element holding the pointer
  // capture, so pointerup never fired and the turn was never applied -- the
  // knob moved on screen and nothing happened underneath, which is the one
  // behaviour a control must never have.
  document.querySelectorAll('.dial').forEach(el=>{
    const k=(DOC.knobs||[]).find(x=>x.name===el.dataset.name); if(!k) return;
    const cap=+el.dataset.cap, svg=el.querySelector('svg');
    const ticks=[...svg.querySelectorAll('line')].slice(0,k.values.length);
    const ptr=svg.querySelector('.ptr'), vv=el.querySelector('.vv');
    let idx=+el.dataset.idx, startY=0, startIdx=0, dragging=false;
    const ang=i=>A0+(A1-A0)*(k.values.length<2?0:i/(k.values.length-1));
    const draw=()=>{
      const a=ang(idx)*Math.PI/180;
      ptr.setAttribute('x2', 36+16.5*Math.sin(a));
      ptr.setAttribute('y2', 36-16.5*Math.cos(a));
      ticks.forEach((t,i)=>t.setAttribute('stroke',
        i>cap?'var(--line)':(i<=idx?'var(--acc)':'var(--faint)')));
      const moved=String(k.values[idx])!==String(k.running);
      vv.innerHTML=`${k.values[idx]}${k.unit?`<em>${k.unit}</em>`:''}`+
        (moved?' <span class="pend">•</span>':'');
    };
    const set=i=>{ i=Math.max(0,Math.min(cap,i)); if(i!==idx){ idx=i; draw(); } };
    svg.addEventListener('pointerdown',e=>{
      dragging=true; startY=e.clientY; startIdx=idx;
      svg.setPointerCapture(e.pointerId); e.preventDefault();
    });
    svg.addEventListener('pointermove',e=>{
      if(dragging) set(startIdx+Math.round((startY-e.clientY)/14));
    });
    const stop=()=>{ if(!dragging) return; dragging=false;
      if(String(k.values[idx])!==String(k.running))
        applyKnob(k.name,k.values[idx]); };
    svg.addEventListener('pointerup',stop);
    svg.addEventListener('pointercancel',stop);
    el.addEventListener('keydown',e=>{
      const d={ArrowUp:1,ArrowRight:1,ArrowDown:-1,ArrowLeft:-1}[e.key];
      if(!d) return; e.preventDefault(); set(idx+d);
      if(String(k.values[idx])!==String(k.running))
        applyKnob(k.name,k.values[idx]);
    });
  });
}
async function applyKnob(name,value){
  const r=await (await fetch('/settings.json',{method:'POST',
    body:JSON.stringify({[name]:value})})).json();
  const what=(r.applied||{})[name];
  $('applies').innerHTML=what?`<b>${esc(name)}</b> ${esc(what)}`:'Nothing changed.';
  loadSettings({tune:ASK.tune||'',working_set_gib:$('ws').value||''});
}
async function loadSettings(q){
  const qs=new URLSearchParams(q||{}).toString();
  try{ DOC=await (await fetch('/settings.json'+(qs?'?'+qs:''))).json() }catch(e){ return }
  ASK=DOC.asked||{};
  $('tunes').innerHTML='';
  (DOC.tunes||[]).forEach(t=>{
    const b=document.createElement('button');
    b.textContent=t.name; b.title=t.why;
    b.setAttribute('aria-pressed',t.name===ASK.tune);
    b.onclick=()=>loadSettings({tune:t.name,working_set_gib:$('ws').value||''});
    $('tunes').appendChild(b);
  });
  if(document.activeElement!==$('ws'))
    $('ws').value=(ASK.working_set_bytes/GIB).toFixed(0);

  // Tiered by who would reach for it, not by what happens to have changed:
  // the memory knobs are the page, the measured flags are a click away, and
  // the kernel internals are named but never defaulted.
  const ks=DOC.knobs||[];
  const dialable=ks.filter(k=>k.values&&k.reach==='live');
  $('dials').innerHTML=dialable.map(dial).join('');
  wireDials();
  // The cap belongs on its own line, not wrapped four deep under a 94px
  // knob: it is a sentence, and a sentence needs the width of the row.
  $('dialnotes').innerHTML=dialable.filter(k=>k.cap!=null).map(k=>
    `<div class="capnote"><b>${esc(k.name.replace(/^(VQ|VQLAB|KNURLOGIC)_/,''))}
     </b> stops at ${esc(k.cap)} — ${esc(k.cap_why)}</div>`).join('');
  const dialled=new Set(ks.filter(k=>k.values&&k.reach==='live').map(k=>k.name));
  const shown=ks.filter(k=>!dialled.has(k.name)&&
    (k.tier==='reach'||k.changed||k.reach==='live'));
  $('knobs').innerHTML=shown.map(knobHTML).join('');
  $('rest').innerHTML=ks.filter(k=>!shown.includes(k)).map(knobHTML).join('');
  const un=DOC.unmanaged||[];
  // An empty <details> still renders the browser's default "Details"
  // marker, which is a row that says nothing.
  $('unmanaged').style.display=un.length?'':'none';
  $('unmanaged').innerHTML=un.length
    ? `<summary>${un.length} more this runtime reads</summary>
       <div class="msg">knurlogic has no measured answer for these, so it sets
       none of them and the runtime's own defaults apply.</div>
       <div class="k" style="color:var(--faint);margin-top:8px;line-height:1.9">
       ${un.map(u=>esc(u.name)).join('  ')}</div>` : '';
  $('env').textContent=DOC.exports||'';

  // The endpoint is worthless until something is pointed at it, and the
  // pointing is four variables nobody remembers.
  const C=DOC.connect;
  if(C){
    const base=location.origin;
    const tabs={'claude code':C.claude, 'openai clients':C.openai};
    const draw=k=>{ $('conn').textContent=(tabs[k]||'').split('__BASE__').join(base);
      [...$('conntabs').children].forEach(b=>
        b.setAttribute('aria-pressed', b.textContent===k)); };
    $('conntabs').innerHTML='';
    Object.keys(tabs).forEach((k,i)=>{
      const b=document.createElement('button');
      b.textContent=k; b.onclick=()=>draw(k); $('conntabs').appendChild(b);
      if(i===0) setTimeout(()=>draw(k),0);
    });
  }

  const chg=ks.filter(k=>k.changed);
  const live=chg.filter(k=>k.reach==='live'), rest=chg.filter(k=>k.reach==='restart');
  $('apply').disabled=!live.length;
  $('applies').innerHTML = !chg.length
    ? `Running <b>${esc(ASK.tune)}</b>.`
    : (live.length?`<b>${live.length}</b> can be applied now. `:'')+
      (rest.length?`<b>${rest.length}</b> need${rest.length===1?'s':''} a restart:
        <code>--tune ${esc(ASK.tune)}</code>`:'');
}
$('apply').onclick=async()=>{
  $('apply').disabled=true;
  const r=await (await fetch('/settings.json',{method:'POST',
    body:JSON.stringify({tune:ASK.tune})})).json();
  const done=Object.entries(r.applied||{}).filter(([k,v])=>!/restart/.test(v));
  $('applies').innerHTML=done.map(([k,v])=>`<b>${esc(k)}</b> ${esc(v)}`).join('<br>')
    ||'Nothing changed.';
  setTimeout(()=>loadSettings({tune:ASK.tune,working_set_gib:$('ws').value||''}),400);
};
$('ws').addEventListener('change',()=>loadSettings({tune:ASK.tune||'',working_set_gib:$('ws').value}));

// --- status ---------------------------------------------------------------
function setState(ok, text){
  const el=$('state');
  el.classList.toggle('off', !ok);
  el.lastElementChild.textContent=text;
}
async function tick(){
  let d;
  try{ d=await (await fetch('/status.json')).json() }
  catch(e){ setState(false,'no answer'); return }
  const a=d.artifact, m=d.memory, C=d.cluster;
  // In a cluster the honest reading is how many nodes ANSWERED, not that
  // the page it is drawn on is up.
  const ns=d.nodes||[], up=ns.filter(n=>n.reachable!==false).length;
  setState(up===ns.length, ns.length>1 ? `${up}/${ns.length} nodes`
    : (up ? 'serving' : 'no answer'));
  if(a){ $('title').textContent=a.name;
    $('sub').textContent=`${a.model_type} · ${gb(a.size_bytes)}`;
    const b=[];
    if(a.is_vq) b.push(['VQ',1]);
    if(a.bundled_runtime) b.push([a.bundled_runtime,1]);
    (d.architectures||[]).forEach(r=>b.push([r.module+' '+r.state,
      r.state==='OK'||r.state==='UNPINNED']));
    $('badges').innerHTML=b.map(([t,on])=>
      `<span class="badge${on?' on':''}">${esc(t)}</span>`).join('');
  }
  // The topology, and the device IS the gauge: each unit fills from the
  // bottom with what that box is holding. A picture of a machine next to a
  // separate number is decoration; a picture that IS the number is not.
  // Three machines, drawn to exo's proportions rather than copied from it:
  // a lid over a trapezoid base for a laptop, a tall block with the front
  // slots for a Studio, a thin slab with the round foot for a mini. exo
  // draws Studio and mini identically -- the only place this deliberately
  // does more, because on a desk they are not remotely the same object.
  //
  // Each fills from the BOTTOM with what that box is holding. A picture of
  // a machine next to a separate number is decoration; a picture that IS
  // the number is not. An unknown machine gets a plain box, on purpose:
  // there is no way to ask a remote node what it is, so it should look
  // unknown rather than look like a guess.
  const SHAPE={
    laptop:(f,c)=>{
      const sw=62,sh=38,sx=13,bh=5;      // screen 70% / base 30%, as exo
      return `<rect x="${sx}" y="2" width="${sw}" height="${sh}" rx="2.5"
          fill="none" stroke="${c}" stroke-width="1.4"/>
        ${f>0?`<rect x="${sx+2.5}" y="${2+sh-2.5-f*(sh-5)}" width="${sw-5}"
          height="${f*(sh-5)}" fill="${c}" opacity=".26"/>`:''}
        <path d="M${sx-8} ${2+sh+bh} L${sx+2} ${2+sh} L${sx+sw-2} ${2+sh}
          L${sx+sw+8} ${2+sh+bh} Z" fill="none" stroke="${c}"
          stroke-width="1.4" stroke-linejoin="round"/>
        <line x1="${sx+22}" y1="${2+sh+bh}" x2="${sx+sw-22}" y2="${2+sh+bh}"
          stroke="${c}" stroke-width="1.4" opacity=".55"/>`},
    studio:(f,c)=>{
      const w=54,h=42,x=17,top=7;        // the tall one, with its face
      return `<rect x="${x}" y="2" width="${w}" height="${h}" rx="3.5"
          fill="none" stroke="${c}" stroke-width="1.4"/>
        ${f>0?`<rect x="${x+1}" y="${2+h-1-f*(h-top-2)}" width="${w-2}"
          height="${f*(h-top-2)}" fill="${c}" opacity=".26"/>`:''}
        <line x1="${x}" y1="${2+top}" x2="${x+w}" y2="${2+top}" stroke="${c}"
          stroke-width="1" opacity=".45"/>
        <rect x="${x+8}" y="${2+h-13}" width="3" height="7" rx="1" fill="${c}"
          opacity=".5"/>
        <rect x="${x+14}" y="${2+h-13}" width="3" height="7" rx="1" fill="${c}"
          opacity=".5"/>
        <rect x="${x+w/2-5}" y="${2+h-11}" width="10" height="3" rx="1"
          fill="${c}" opacity=".5"/>`},
    mini:(f,c)=>{
      const w=58,h=21,x=15,y=15;         // the slab, and the round foot
      return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4"
          fill="none" stroke="${c}" stroke-width="1.4"/>
        ${f>0?`<rect x="${x+1}" y="${y+h-1-f*(h-2)}" width="${w-2}"
          height="${f*(h-2)}" fill="${c}" opacity=".26"/>`:''}
        <circle cx="${x+8}" cy="${y+h/2}" r="1.6" fill="${c}" opacity=".6"/>
        <ellipse cx="${x+w/2}" cy="${y+h+3}" rx="${w*.34}" ry="2.4"
          fill="none" stroke="${c}" stroke-width="1.2" opacity=".55"/>`},
    "":(f,c)=>{
      const w=56,h=34,x=16,y=8;
      return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2"
          fill="none" stroke="${c}" stroke-width="1.4" stroke-dasharray="4 3"/>
        ${f>0?`<rect x="${x+1}" y="${y+h-1-f*(h-2)}" width="${w-2}"
          height="${f*(h-2)}" fill="${c}" opacity=".26"/>`:''}`}};
  SHAPE.imac=SHAPE.laptop; SHAPE.pro=SHAPE.studio;

  function unit(n){
    const nm=n.memory||{}, ws=nm.working_set_bytes||1;
    const pct=Math.max(0,Math.min(100,100*(nm.active_bytes||0)/ws));
    const off=n.reachable===false||!nm.available;
    const c=off?'var(--line)':'var(--acc)';
    const kind=(n.machine||{}).kind||'';
    const draw=SHAPE[kind]||SHAPE[''];
    const model=(n.machine||{}).model||'';
    return `<div class="unit">
      <div class="nm">${esc(n.node)}</div>
      <svg width="88" height="56" viewBox="0 0 88 56"${
        model?` aria-label="${esc(model)}"`:''}>${draw(off?0:pct/100,c)}</svg>
      <div class="stat"><span class="pct">${off?'--':pct.toFixed(0)+'%'}</span>
        ${off?'no answer':gb(nm.active_bytes||0)+' / '+gb(ws)}</div>
    </div>`;
  }
  // One node still gets its unit: the picture is the gauge, not an
  // ornament that only earns its place when there are two of them.
  // The link between nodes animates along its length. That is the only
  // motion on the page that carries information -- it says the link is
  // live -- so it is also the only one, and it stops under reduced-motion.
  //
  // It is drawn for TWO nodes and no more. Chaining it between three or
  // four would draw a line, and a line is not the shape of the cluster --
  // the nodes are not wired in series. With two, a connector is the truth;
  // past two it is a picture of a topology that does not exist, and it also
  // dangles off the end of every row that wraps.
  const ns_=d.nodes||[];
  $('topo').innerHTML=ns_.map(unit).join(ns_.length===2
    ? '<svg class="flow" viewBox="0 0 56 20" aria-hidden="true">'+
      '<line x1="2" y1="10" x2="54" y2="10"/></svg>'
    : '');
  // One line under the machines. The gauges carry the split; this carries
  // the totals, and only the figures that are not already drawn above.
  if(m&&m.available){
    LASTWS=(d.nodes||[]).reduce((x,n)=>Math.max(
      x,(n.memory||{}).working_set_bytes||0), 0)||m.working_set_bytes||0;
    const box=m.scope==='box', bit=(k,v)=>`<span>${k} <b>${v}</b></span>`;
    $('mem').innerHTML=
      bit(box?'in use':'weights + live', gb(m.active_bytes))+
      bit('cache', gb(m.cache_bytes))+
      bit('free', gb(m.headroom_bytes))+
      (C&&C.nodes_total>1
        ? bit('nodes', `${C.nodes_reachable}/${C.nodes_total}`)
        : Number.isFinite(m.peak_bytes) ? bit('peak', gb(m.peak_bytes)) : '');
  }
  const w=d.wired;
  if(w&&w.action==='raise'&&w.command)
    $('mem').innerHTML+=`<div class="msg">The GPU may wire only
      <b>${gb(w.limit_bytes)}</b> of ${gb(w.total_bytes)} installed.
      <code style="user-select:all">${esc(w.command)}</code></div>`;
}
// --- what else is here ----------------------------------------------------
// Shown, not offered: a loaded model is loaded, and a page that presents a
// list of models as if any of them could be clicked into service would be
// promising something the runtime cannot do. What it can hand over is the
// command, which is why the row opens one.
// Runs AFTER the first status, not beside it: "fits this box" needs the
// working set, and two fetches racing means the list is sorted against zero
// about half the time.
async function loadModels(){
  let d; try{ d=await (await fetch('/models.json')).json() }catch(e){ return }
  const rows=(d.models||[]).filter(m=>!m.serving);
  const el=$('others');
  if(!rows.length){ el.innerHTML='<div class="other no"><div class="n">nothing else found</div></div>'; return }
  // A disk with fifty rungs on it is not a list, it is a wall. What is
  // useful next to a loaded model is the ones that would ALSO fit this
  // machine, biggest first -- the rung above and below where you are. The
  // rest are a count, and open if you want them.
  const ws=(LASTWS||0);
  const fits=rows.filter(m=>m.servable && (!ws || m.size_bytes<=ws))
                 .sort((a,b)=>b.size_bytes-a.size_bytes);
  const SHOW=7;
  const rest=rows.length-Math.min(fits.length,SHOW);
  const line=m=>`<div class="other" data-p="${esc(m.path)}">
      <div class="n">${esc(m.name)}</div>
      <div class="s">${(m.size_bytes/GIB).toFixed(0)} GiB${
        m.is_vq?' · VQ':''}${m.mtp?' · MTP':''}</div></div>`;
  el.innerHTML=fits.slice(0,SHOW).map(line).join('')
    + (rest>0 ? `<div class="other no" id="morem"><div class="n">+ ${rest} more</div>
        <div class="s">${fits.length>SHOW?`${fits.length-SHOW} that fit · `:''}${
        rows.filter(m=>!m.servable||(ws&&m.size_bytes>ws)).length} that do not</div></div>`
      : '');
  const more=$('morem');
  if(more) more.onclick=()=>{
    more.remove();
    const seen=new Set(fits.slice(0,SHOW).map(m=>m.path));
    el.insertAdjacentHTML('beforeend', rows.filter(m=>!seen.has(m.path))
      .sort((a,b)=>b.size_bytes-a.size_bytes)
      .map(m=>m.servable&&(!ws||m.size_bytes<=ws) ? line(m)
        : `<div class="other no"><div class="n">${esc(m.name)}</div>
           <div class="s">${(m.size_bytes/GIB).toFixed(0)} GiB · ${
           m.servable?'more than this box':'not loadable here'}</div></div>`)
      .join(''));
    wireOthers();
  };
  wireOthers();
  function wireOthers(){
  el.querySelectorAll('.other[data-p]').forEach(r=>r.onclick=()=>{
    const open=r.querySelector('pre');
    el.querySelectorAll('pre').forEach(x=>x.remove());
    if(open) return;
    const pre=document.createElement('pre');
    pre.textContent=`knurlogic serve "${r.dataset.p}"`;
    r.appendChild(pre);
  });
  }
}

tick().then(loadModels); loadSettings({}); setInterval(tick,2000);

// --- try it, which is really "measure it" ---------------------------------
// This panel is a bench, not a chat window. The reason to send a prompt here
// is to turn a knob and send it again, so every reply carries three numbers:
//
//   TTFT        wall time to the first token. What a harness feels as lag.
//   prefill     tokens/s through the prompt -- the phase the memory knobs
//               actually govern, and the one that spikes.
//   decode      tokens/s after the first token.
//
// Measuring prefill at all requires STREAMING (a non-streaming call cannot
// tell you when the first token appeared) plus `stream_options.include_usage`,
// which is how mlx-lm reports the token counts.
//
// THE TRAP, and it would have made this instrument lie: `prompt_tokens`
// includes tokens served from the prompt cache, which were never prefilled.
// Send the same prompt twice while turning a knob -- exactly what this panel
// is for -- and the second run divides a full prompt by a near-zero prefill
// time. So the rate uses prompt_tokens MINUS cached_tokens, and when that is
// zero the rate is not shown at all: there is nothing to have a rate of.
const log=$('log');
function say(who,t){const p=document.createElement('p');p.innerHTML=`<b>${who}</b> `;
  p.appendChild(document.createTextNode(t));log.appendChild(p);log.scrollTop=1e9;return p}

// The point of running twice is the difference, so the page draws the
// difference. A line telling you to compare the two numbers is a line
// doing work the numbers should be doing themselves.
//
// Only against the run above it, and only when that run measured the same
// thing: a delta against a different prompt is not a delta.
// One sample per arm cannot support a small difference, so anything under
// 5% reads as "=" rather than as a change. Drawing a 2% wobble with an arrow
// on it is the same error as quoting a speed claim from a single run.
function delta(now, was){
  if(!(now>0&&was>0)) return '';
  const pc=100*(now-was)/was;
  if(Math.abs(pc)<5) return '<i class="d flat">=</i>';
  return `<i class="d ${pc>0?'up':'down'}">${pc>0?'▲':'▼'}${
    Math.abs(pc).toFixed(0)}%</i>`;
}
function metHTML(m, prev){
  if(!m) return '';
  const same=prev && prev.prompt===m.prompt;
  const bit=(k,v,warn)=>`<span class="${warn?'warnv':''}">${k} <b>${v}</b></span>`;
  let h=bit('ttft', m.ttft_ms<1000?`${Math.round(m.ttft_ms)} ms`
                                  :`${(m.ttft_ms/1000).toFixed(2)} s`);
  if(m.prefill_tps) h+=bit('prefill', `${Math.round(m.prefill_tps)} tok/s`+
    (same?delta(m.prefill_tps, prev.prefill_tps):''));
  if(m.decode_tps) h+=bit('decode', `${m.decode_tps.toFixed(1)} tok/s`+
    (same?delta(m.decode_tps, prev.decode_tps):''));
  // Prefill is the rate of NEW prefill either way -- cached tokens are
  // already out of it -- so a cache hit is a smaller sample, not a wrong
  // number. Shown because it explains a thin measurement, not warned about.
  if(m.prompt) h+=bit('prompt', m.cached?`${m.prompt-m.cached} new of ${m.prompt}`
                                        :String(m.prompt));
  if(m.completion) h+=bit('out', String(m.completion));
  return `<div class="met">${h}</div>`;
}
function showMet(afterEl, m, prev){
  const d=document.createElement('div');
  d.innerHTML=metHTML(m, prev); const el=d.firstElementChild;
  if(el){ afterEl.after(el); log.scrollTop=1e9 }
}
function lastMet(){
  const r=RUNS.find(x=>x.id===CUR);
  return r ? (r.msgs||[]).map(x=>x.met).filter(Boolean).pop() : null;
}

// --- chat memory ----------------------------------------------------------
// Cheap on purpose: this browser's localStorage, no server state, no
// database. Losing it costs a list of old prompts, which is the right price
// for something that has to work the moment the page is opened. (The drawer
// state was removed from storage for a different reason -- it changed what
// the page DID. A remembered prompt does not.)
const STORE='kn.runs';
let RUNS=[], CUR=null;
function loadRuns(){ try{ RUNS=JSON.parse(localStorage.getItem(STORE)||'[]') }
  catch(e){ RUNS=[] } if(!Array.isArray(RUNS)) RUNS=[] }
function saveRuns(){ try{ localStorage.setItem(STORE,JSON.stringify(RUNS.slice(0,40))) }
  catch(e){} }
function best(run){
  // The list is for comparing runs, so the summary is the number being
  // tuned, not the time of day.
  const m=(run.msgs||[]).map(x=>x.met).filter(Boolean).pop();
  if(!m) return run.tune||'';
  const pf=m.prefill_tps?`${Math.round(m.prefill_tps)} pf`:'';
  const dc=m.decode_tps?`${m.decode_tps.toFixed(0)} tok/s`:'';
  return [run.tune,pf,dc].filter(Boolean).join(' · ');
}
function renderRuns(){
  const el=$('chats');
  if(!RUNS.length){ el.innerHTML=
    '<div class="sidelab">no runs yet</div>'; return }
  el.innerHTML='<div class="sidelab">runs</div>'+RUNS.map((r,i)=>
    `<div class="chat" data-i="${i}" aria-current="${r.id===CUR}">
       <span class="x" data-del="${i}" title="delete">×</span>
       <div class="t">${esc(r.title||'untitled')}</div>
       <div class="m">${esc(best(r))}</div></div>`).join('');
  el.querySelectorAll('.chat').forEach(c=>c.onclick=e=>{
    if(e.target.dataset.del!==undefined){
      RUNS.splice(+e.target.dataset.del,1); saveRuns();
      if(!RUNS.some(r=>r.id===CUR)) newRun(); else renderRuns();
      return;
    }
    openRun(RUNS[+c.dataset.i]);
  });
}
function newRun(){ CUR=null; log.innerHTML=''; renderRuns(); $('q').focus() }
function openRun(r){
  CUR=r.id; log.innerHTML='';
  let prev=null;
  (r.msgs||[]).forEach(m=>{
    const p=say(m.role==='user'?'you':'it', m.content);
    if(m.met){ showMet(p, m.met, prev); prev=m.met }
  });
  renderRuns();
}
function record(role, content, met){
  if(CUR===null){
    CUR=String(Date.now());
    RUNS.unshift({id:CUR, title:content.slice(0,52), at:Date.now(),
                  tune:(ASK&&ASK.tune)||'', msgs:[]});
  }
  const r=RUNS.find(x=>x.id===CUR);
  if(r){ r.msgs.push({role,content,met}); r.tune=(ASK&&ASK.tune)||r.tune }
  saveRuns(); renderRuns();
}
$('newchat').onclick=newRun;
loadRuns(); renderRuns();

// --- the timed request ----------------------------------------------------
// Enter sends, explicitly. A form with one text input and a submit button
// implicitly submits on Enter, and that is exactly the kind of "should work"
// worth nailing down on the one control the whole panel exists to use.
// Disabling the button does not stop implicit submission either, so the
// in-flight guard is here rather than on the button.
let BUSY=false;
$('q').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){
    e.preventDefault(); $('f').requestSubmit();
  }
});
// "fresh prefill" is NOT a cache off-switch, and calling it one would be a
// claim this server cannot honour: mlx-lm has no per-request option for it
// (checked -- the body options are stream/temperature/penalties and no
// more), only the `--prompt-cache-size` flag it was started with. What it
// has is a PREFIX TRIE: a cached entry is reused only for a shared leading
// token run. So a unique marker at the FRONT of the prompt leaves nothing to
// share, and the prompt is genuinely pushed through the model again.
//
// It cannot reach zero cached tokens and does not pretend to -- the chat
// template's own preamble sits ahead of anything we write and stays shared.
// That is why the rate subtracts `cached_tokens` regardless of this box: the
// checkbox makes the measurement BIG, the subtraction makes it HONEST, and
// the two are independent.
let LAST='';
function withNonce(q){
  return $('fresh').checked
    ? `[bench ${Math.random().toString(36).slice(2,8)}] ${q}` : q;
}
$('again').onclick=()=>{ if(LAST && !BUSY) send(LAST) };

async function send(q){
  if(BUSY||!q) return;
  BUSY=true; LAST=q; $('again').disabled=true;
  const prev=lastMet();
  $('q').value=''; say('you',q); record('user',q,null);
  const out=say('it','…'); $('go').disabled=true;
  const sent=withNonce(q);
  const t0=performance.now();
  let first=0, text='', usage=null;
  try{
    const r=await fetch('/v1/chat/completions',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:[{role:'user',content:sent}],max_tokens:256,
        stream:true, stream_options:{include_usage:true}})});
    if(!r.ok||!r.body) throw new Error('HTTP '+r.status);
    const rd=r.body.getReader(), dec=new TextDecoder();
    let buf='';
    for(;;){
      const {value,done}=await rd.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      let nl;
      while((nl=buf.indexOf('\n'))>=0){
        const line=buf.slice(0,nl).trim(); buf=buf.slice(nl+1);
        if(!line.startsWith('data:')) continue;
        const payload=line.slice(5).trim();
        if(payload==='[DONE]') continue;
        let j; try{ j=JSON.parse(payload) }catch(err){ continue }
        if(j.usage) usage=j.usage;
        const piece=j.choices?.[0]?.delta?.content;
        if(piece){
          if(!first) first=performance.now();
          text+=piece; out.lastChild.textContent=text; log.scrollTop=1e9;
        }
      }
    }
    const end=performance.now();
    let met=null;
    if(first){
      const ttft=first-t0;
      const prompt=usage?.prompt_tokens||0;
      const cached=usage?.prompt_tokens_details?.cached_tokens||0;
      const fresh=Math.max(prompt-cached,0);
      const comp=usage?.completion_tokens||0;
      met={ttft_ms:ttft, prompt, cached, completion:comp, fresh:$('fresh').checked,
           // Only tokens actually pushed through the model count toward a
           // prefill rate, and only when there were any.
           prefill_tps: fresh>0 ? fresh/(ttft/1000) : 0,
           decode_tps: (comp>1 && end>first) ? (comp-1)/((end-first)/1000) : 0};
    }
    if(!text) out.lastChild.textContent='(no content)';
    showMet(out, met, prev);
    record('assistant', text||'(no content)', met);
  }catch(err){ out.lastChild.textContent=String(err);
    record('assistant',String(err),null) }
  BUSY=false; $('go').disabled=false; $('again').disabled=!LAST;
}
$('f').onsubmit=e=>{ e.preventDefault(); send($('q').value.trim()) };
</script>
