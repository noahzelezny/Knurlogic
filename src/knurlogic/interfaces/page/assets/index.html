<!doctype html><meta charset="utf-8"><title>knurlogic</title>
<link rel="stylesheet" href="/page.css">
<header>
  <div class="live ro" id="state"><i></i><span>connecting</span></div>
  <!-- The mark is a knurl: the crosshatch cut into a machined part so a hand
       can grip it. The wheel sits BEHIND the word with its teeth showing
       above and below, so the name reads as something you turn. -->
  <div class="mark" id="mark" title="Dashboard">
    <svg class="wheel" viewBox="0 0 120 120" aria-hidden="true">
      <g id="knurl"></g>
    </svg>
    <b>knurlogic</b>
  </div>
  <nav>
    <a data-panel="settings">Settings</a>
    <a data-panel="connect">Connect</a>
    <a data-panel="downloads">Downloads<span class="badge" id="dlbadge" hidden></span></a>
  </nav>
</header>
<div class="wrap">
  <div class="app">
    <!-- Chat memory, as exo keeps it: a list on the left you can go back to.
         It lives in this browser and nowhere else -- runs are kept so a knob
         change can be compared against the last one, which is the whole job
         of this page. -->
    <aside class="side">
      <button class="newchat" id="newchat">+ New chat</button>
      <div id="chats"></div>
      <section id="csettings">
        <div class="sidelab">Chat</div>
        <!-- How full the conversation is: the last reply's prompt + answer
             over the served model's window. -->
        <div class="cs"><span class="cslab" style="margin:0;flex:1">context</span><span class="ro" id="cctx" style="text-transform:none">—</span></div>
        <label class="cslab" for="csys">system prompt</label>
        <textarea id="csys" rows="3" placeholder="(none)"></textarea>
      </section>
    </aside>
    <main>
      <section class="panel" id="memory">
        <div class="lab">Memory</div>
        <div class="topo n1"><div class="topounits" id="topo"></div>
          <div id="ramwent"></div></div>
        <div id="mem" class="ro"></div>
      </section>
      <section class="panel" id="try">
        <div class="lab tabbedlab" style="display:none">
          <span class="seg tabseg" id="ptabs">
            <button class="on" data-tab="chat">Chat</button>
            <button data-tab="bench">Bench</button>
          </span>
        </div>
        <section id="chat">
          <div id="clog"></div>
          <div id="chips" class="chips"></div>
          <div id="pfbar" class="pfbar" hidden>
            <div class="pfbarfill"></div><span class="pfbartxt"></span></div>
          <!-- The bar and the options that float over what is above it:
               outside the form, so Enter in a field there is not a Send. -->
          <div class="cbar">
            <!-- What Send goes to and how hard it thinks, on one line above
                 the box: the two things to check before sending. -->
            <div class="chd">
              <label class="cl">Model:
              <select id="cmodel" title="the running model Send goes to"></select></label>
              <label class="cl">Thinking:
              <select id="ceffort" title="reasoning_effort: knurlogic maps it onto this model's own controls and says what it applied">
                <option value="">model default</option>
              </select></label>
            </div>
            <form id="cf">
              <div class="crow">
                <button type="button" id="cattach" class="mini" title="attach image"
                  disabled>📎</button>
                <input id="cfile" type="file" multiple hidden
                  accept="image/*,text/*,.md,.json,.py">
                <textarea id="cq" rows="1"
                  placeholder="Type away; click a running model to send it"></textarea>
                <button class="go" id="csend" disabled>Send</button>
                <button type="button" class="go danger" id="cstop" hidden>Stop</button>
              </div>
            </form>
          </div>
        </section>
        <section id="bench" hidden>
          <div id="log"></div>
          <form id="f"><input id="q" placeholder="A prompt to measure with" autocomplete="off">
            <button class="go" id="go">Run</button></form>
          <div class="bench">
            <button id="again" class="mini" disabled>Run it again</button>
            <label class="chk"><input type="checkbox" id="fresh" checked>
              fresh prefill</label>
          </div>
        </section>
      </section>
    </main>
    <aside class="right">
      <section class="panel" id="runningpanel">
        <div class="lab">Instances</div>
        <div class="loaded" id="served">
          <div class="nm" id="title">—</div>
          <div class="msg" id="sub">loading…</div>
          <div id="badges" class="badges"></div>
        </div>
        <div id="resident"></div>
      </section>
      <section class="panel" id="diskpanel">
        <div class="lab">Load model</div>
        <div class="loadhd"><span id="diskcount" class="ro"></span></div>
        <button id="openpick" class="pickbtn">
          <span id="pickname">choose a model</span>
          <span id="picksize" class="ro"></span></button>
        <div id="multiopts" hidden>
          <div class="opt"><div class="optlab">Sharding</div>
            <span class="seg" data-k="shard"><button data-v="tensor" aria-pressed="true">Tensor</button><button data-v="pipeline" aria-pressed="false">Pipeline</button></span></div>
          <div class="opt"><div class="optlab">Interconnect</div>
            <span class="seg" data-k="link"><button data-v="tcp" aria-pressed="true">TCP/IP</button><button data-v="rdma" aria-pressed="false">RDMA</button></span></div>
        </div>
        <div id="lmwhere"></div>
        <div id="mtpopts" hidden>
          <div class="optrow"><div class="optlab">MTP</div>
            <span class="seg" data-k="mtp" title="multi-token prediction: draft with the head the model ships (KNURLOGIC_MTP)"><button data-v="on" aria-pressed="true">On</button><button data-v="off" aria-pressed="false">Off</button></span></div>
          <div class="optrow" id="mtpdynrow"><div class="optlab">Dynamic MTP</div>
            <span class="seg" data-k="dyn" title="switch between drafting and plain steps by their measured cost (KNURLOGIC_MTP_DYNAMIC)"><button data-v="on" aria-pressed="true">On</button><button data-v="off" aria-pressed="false">Off</button></span></div>
        </div>
        <div id="pickinfo"></div>
        <button class="go" id="launch" style="width:100%;margin-top:10px">
          Launch</button>
      </section>
    </aside>
  </div>
</div>
<!-- The picker is a modal over the page, as exo's is: a search, the memory
     it has to fit inside, families down the side, and one row per model with
     its variants folded into it. A dropdown cannot hold fifty rungs in a way
     anyone can read. -->
<div class="modal" id="picker" hidden>
  <div class="box">
    <div class="pickhd">
      <input id="psearch" placeholder="Search models" autocomplete="off">
      <span class="ro" id="pbudget"></span>
      <button id="pclose" class="mini">Close</button>
    </div>
    <div class="pickbody">
      <div class="fams" id="pfams"></div>
      <div class="rows" id="prows"></div>
    </div>
  </div>
</div>
<!-- Fullscreen image lightbox for chat attachments: Esc or a click on the
     backdrop closes it, and a download link is filled in per image. -->
<div class="lightbox" id="lightbox" hidden>
  <img id="lbimg" alt="">
  <div class="lbbar">
    <a id="lbdl" download class="mini">Download</a>
    <button id="lbclose" class="mini">Close  esc</button>
  </div>
</div>
<!-- Settings and Connect: the same overlay as the picker, one panel shown
     at a time, over whichever layout you were on. -->
<div class="modal" id="sheet" hidden>
  <div class="box menu">
    <div class="sheethd">
      <b class="ro" id="sheettitle"></b>
      <button id="sheetclose" class="mini">Close</button>
    </div>
    <div class="sheetbody">
      <!-- Laid out like the picker: CLUSTER | MODELS across the top, the
           tab's list down the side (the machines; the base models), and the
           picked one's settings beside it -- a model's knobs are the
           model's, whichever rung of it runs and whichever machine it sits
           on. -->
      <section class="panel" id="settings">
        <div class="lab">Settings</div>
        <div class="pickhd"><span class="seg tabseg" id="settabs"></span></div>
        <div class="pickbody">
          <div class="fams" id="setlist"></div>
          <div class="sbody" id="machbody"></div>
        </div>
      </section>
      <section class="panel" id="connect">
        <div class="lab">Connect</div>
        <div class="pickbody">
          <div class="fams" id="conntabs"></div>
          <div class="sbody" id="conn"></div>
        </div>
      </section>
      <section class="panel" id="downloads">
        <div class="lab">Downloads</div>
        <div class="dlbody" id="dllist"></div>
      </section>
    </div>
  </div>
</div>
<script type="module" src="/app.js"></script>
