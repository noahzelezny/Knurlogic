<!doctype html><meta charset="utf-8"><title>knurlogic</title>

<style>
 /* Exo's dashboard is a COMMAND CENTER: neutral dark greys in oklch, one
    saturated accent, monospace everywhere, and panels that read as lit
    instrument faces rather than cards. Its own app.css is the source for
    every number below -- bg 0.12, card 0.16, border 0.22, muted text 0.6,
    radius 0.375rem, 40px grid, 6px scrollbars, 0.02em body tracking.
    The one deliberate departure is the hue: teal, not yellow. */
 :root{
   --bg:oklch(.12 0 0);--panel:oklch(.16 0 0);--med:oklch(.22 0 0);
   --fg:oklch(.9 0 0);--dim:oklch(.6 0 0);--faint:oklch(.45 0 0);
   --line:oklch(.25 0 0);--grid:oklch(.2 0 0/.3);
   --ok:oklch(.78 .15 150);--warn:oklch(.78 .15 70);--bad:oklch(.68 .19 25);
   --acc:oklch(.82 .14 185);--accfg:oklch(.14 .02 185);
   --glow:0 0 20px oklch(.82 .14 185/.3);
   --r:.375rem}
 /* Light mode is not exo's -- exo is dark only -- but a page that blinds
    someone at a bright desk is not usable, whatever it looks like. */
 @media(prefers-color-scheme:light){:root{
   --bg:oklch(.97 0 0);--panel:oklch(1 0 0);--med:oklch(.93 0 0);
   --fg:oklch(.2 0 0);--dim:oklch(.45 0 0);--faint:oklch(.6 0 0);
   --line:oklch(.89 0 0);--grid:oklch(.8 0 0/.35);
   --ok:oklch(.5 .14 150);--warn:oklch(.55 .13 70);--bad:oklch(.55 .19 25);
   --acc:oklch(.55 .11 185);--accfg:oklch(1 0 0);--glow:none}}
 *{box-sizing:border-box}
 /* This is a control surface on a desk, often on a large display, and it
    was capped at 1320px of 13px type -- which on a big screen is a small
    page in a wide black frame. The type scales with the viewport and the
    layout uses the width it is given. Nothing here is a phone concern; a
    16" and a 27" are both ordinary. */
 body{margin:0;min-width:940px;background:var(--bg);color:var(--fg);
   letter-spacing:.02em;
   font:clamp(13px, 0.95vw, 18px)/1.6 'SF Mono','Fira Code',ui-monospace,
     SFMono-Regular,Menlo,'DejaVu Sans Mono',monospace;
   background-image:linear-gradient(var(--grid) 1px,transparent 1px),
     linear-gradient(90deg,var(--grid) 1px,transparent 1px);
   background-size:40px 40px;background-attachment:fixed}
 /* The CRT scanline, at exo's exact period. It is the cheapest single thing
    that makes a dark panel read as a screen instead of a div. */
 body:before{content:'';position:fixed;inset:0;pointer-events:none;z-index:100;
   background:repeating-linear-gradient(0deg,transparent,transparent 2px,
     oklch(0 0 0/.03) 2px,oklch(0 0 0/.03) 4px)}
 ::-webkit-scrollbar{width:6px;height:6px}
 ::-webkit-scrollbar-track{background:oklch(.1 0 0)}
 ::-webkit-scrollbar-thumb{background:oklch(.3 0 0);border-radius:3px}
 ::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--acc) 50%,transparent)}
 a{color:inherit;text-decoration:none}
 /* --- masthead: a wordmark, and the nav exo puts opposite it -------------- */
 header{border-bottom:1px solid var(--line);padding:14px 24px;display:grid;
   grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;
   background:linear-gradient(180deg,oklch(.16 0 0/.95),oklch(.12 0 0/.98));
   position:sticky;top:0;z-index:20;backdrop-filter:blur(6px)}
 @media(prefers-color-scheme:light){header{
   background:linear-gradient(180deg,oklch(1 0 0/.95),oklch(.97 0 0/.98))}}
 /* exo centres its logo and pins everything else to the edges. */
 header>.live{justify-self:start}
 header>nav{justify-self:end}
 .mark{position:relative;display:flex;align-items:center;justify-content:center;
   justify-self:center}
 .mark b{font-size:19px;font-weight:700;letter-spacing:.22em;
   text-transform:uppercase;text-shadow:var(--glow);position:relative;z-index:1}
 /* Taller than the bar: the teeth are meant to break its top and bottom
    edge, which is the whole reason it is a wheel and not a bullet point. */
 .wheel{position:absolute;left:50%;top:50%;width:72px;height:72px;
   transform:translate(-50%,-50%);pointer-events:none;overflow:visible}

 /* exo's data-readout: 11px, uppercase, wide tracking. Small text on this
    page is an INSTRUMENT LABEL, never prose. */
 .ro{font-size:11px;letter-spacing:.05em;text-transform:uppercase}
 .live{display:flex;align-items:center;gap:7px;color:var(--dim)}
 .live i{width:7px;height:7px;border-radius:50%;background:var(--ok);
   box-shadow:0 0 8px currentColor;animation:pulse 2s ease-in-out infinite}
 .live.off i{background:var(--warn);animation:none}
 @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
 nav{display:flex;gap:20px;font-size:11px;letter-spacing:.16em;
   text-transform:uppercase;color:var(--dim)}
 nav a:hover{color:var(--acc)}
 .wrap{max-width:2000px;margin:0 auto;padding:22px 28px 60px}
 /* Chat memory on the left, the way exo keeps it. */
 /* Two layouts, both of them desktop: three columns, and the same three
    with the model rail dropped underneath for a window shoved to half a
    screen. Below that the page scrolls sideways like any other desktop
    app rather than pretending to be a phone.
    The drop was at 1240px, which is wider than plenty of ordinary windows
    -- a maximised 13" is 1280 and a window with anything beside it is well
    under. Three columns need 190 + 400 + 280 + gaps + padding = 990, so
    that is where it drops, and the middle column is allowed to squeeze
    rather than the rail being thrown to the bottom. */
 .app{display:grid;grid-template-columns:15em minmax(26em,1fr) 21em;
   gap:1.7em;align-items:start}
 @media(max-width:1010px){.app{grid-template-columns:15em minmax(0,1fr)}
   .right{grid-column:1/-1;order:3}
   .right .panel{max-width:none}}
 .right{min-width:0}
 .right .panel{margin-bottom:0}
 .loaded .nm{font-size:13px;font-weight:700;letter-spacing:.02em;
   word-break:break-word}
 .loaded .msg{margin-top:3px}
 .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
 .badge{font-size:9px;letter-spacing:.1em;text-transform:uppercase;
   border:1px solid var(--line);color:var(--dim);padding:1px 5px;border-radius:2px}
 .badge.on{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
 /* Other models are shown, never switched to: a loaded model is loaded.
    What is on offer is the command that would serve one. */
 .other{padding:7px 0;border-top:1px solid var(--line);cursor:pointer}
 .other:first-child{border-top:0}
 .other .n{font-size:11.5px;white-space:nowrap;overflow:hidden;
   text-overflow:ellipsis;color:var(--dim)}
 .other:hover .n{color:var(--fg)}
 .other .s{font-size:10px;color:var(--faint);letter-spacing:.04em;margin-top:2px}
 .other.no .n{color:var(--faint)}
 /* One card per thing that is running, the way exo shows an instance: a
    header saying what it is and how to stop it, then the name, then what it
    costs. A one-line row with a bare x made a loaded model read as a list
    item rather than as something occupying the machine. */
 .card{border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;
   margin-bottom:8px;background:var(--bg)}
 .card.loaded{border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
 .card.loading{border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
 .cardhd{display:flex;align-items:center;gap:7px;margin-bottom:6px}
 .cardhd .grow{flex:1}
 .card .rt{font-size:9px;letter-spacing:.08em;text-transform:uppercase;
   border:1px solid var(--line);padding:0 4px;border-radius:2px;flex:none}
 .card .rt.knurlogic,.card .rt.exo{color:var(--acc);
   border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
 .card .n{font-size:11.5px;white-space:nowrap;overflow:hidden;
   text-overflow:ellipsis}
 .card .s{font-size:10px;color:var(--faint);letter-spacing:.04em;margin-top:3px}
 .card.offered .n{color:var(--dim)}
 .card .dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--ok)}
 .card.loading .dot{background:var(--warn);animation:pulse 2s ease-in-out infinite}
 .card.offered .dot{background:var(--faint)}
 .mini.danger:hover:not([disabled]){color:var(--warn);border-color:var(--warn)}
 /* The key goes INSIDE the screen, in the black beside the machines, and
    stacked. Laid out in a row underneath it read as a caption for the panel
    rather than as a legend for the fills -- the swatches were as far from
    the colours they name as they had been in the other column. Beside the
    machine, vertical, it is obviously part of the same picture. */
 .topounits{display:flex;align-items:center;justify-content:center;gap:0;
   flex-wrap:wrap}
 /* Was absolutely positioned against the right edge, which works for one
    machine and collides with the second: the row of units grows and the key
    does not move. A flex item instead, so the machines and the key share
    the space rather than being drawn on top of each other. */
 .topounits{flex:1;min-width:0}
 #ramwent{flex:none;margin-left:clamp(8px,2%,28px)}
 .ram{display:flex;flex-direction:column;gap:5px}
 @media(max-width:1150px){
   .topo{flex-wrap:wrap}
   .topounits{flex:1 0 100%}
   #ramwent{margin:6px auto 0}}
 .ramrow{display:flex;align-items:center;gap:7px;font-size:10.5px;
   letter-spacing:.04em;white-space:nowrap}
 .ramrow span{flex:1}
 .ramrow b{color:var(--fg);font-weight:700}
 .ramrow span{color:var(--dim)}
 .ramrow em{width:8px;height:8px;border-radius:2px;display:inline-block;
   font-style:normal;flex:none}
 .ramrow.sub{padding-left:10px;font-size:10px}
 .ramrow em.hatch{background:repeating-linear-gradient(135deg,var(--c) 0 1.5px,
   transparent 1.5px 3.5px);border:1px solid var(--c)}
 .pickbtn{width:100%;display:flex;align-items:center;justify-content:space-between;
   gap:10px;background:var(--bg);border:1px solid var(--line);
   border-radius:var(--r);padding:9px 10px;cursor:pointer;color:var(--fg);
   font:inherit;font-size:11.5px;text-align:left}
 .pickbtn:hover{border-color:var(--acc)}
 .pickbtn #picksize{color:var(--faint);flex:none}
 .modal{position:fixed;inset:0;z-index:50;background:oklch(0 0 0/.6);
   display:flex;align-items:center;justify-content:center;padding:40px 24px}
 .modal[hidden]{display:none}
 /* A FIXED frame. With max-height the box sized to its contents, so
    picking a family with one model in it collapsed the whole dialog and
    filtering felt like the window was fighting you. The frame stays put and
    the list scrolls inside it. */
 .modal .box{width:min(980px,100%);height:min(720px,82vh);display:flex;
   flex-direction:column;border:1px solid var(--line);border-radius:var(--r);
   background:var(--panel);box-shadow:0 20px 60px oklch(0 0 0/.6);
   overflow:hidden}
 .pickhd{display:flex;align-items:center;gap:14px;padding:12px 14px;
   border-bottom:1px solid var(--line)}
 .pickhd input{flex:1;background:transparent;border:0;font-size:13px}
 .pickhd input:focus{outline:none}
 #pbudget{color:var(--faint);white-space:nowrap}
 #pbudget b{color:var(--acc)}
 .pickbody{display:grid;grid-template-columns:132px 1fr;min-height:0;flex:1}
 .pickhd{flex:none}
 .fams{border-right:1px solid var(--line);overflow:auto;padding:6px 0}
 .fam{padding:8px 12px;cursor:pointer;font-size:11px;letter-spacing:.06em;
   text-transform:uppercase;color:var(--dim);border-left:2px solid transparent}
 .fam:hover{color:var(--fg)}
 .fam[aria-current=true]{color:var(--acc);border-left-color:var(--acc);
   background:color-mix(in srgb,var(--acc) 7%,transparent)}
 .fam i{font-style:normal;color:var(--faint);float:right}
 .rows{overflow-y:scroll}   /* always, so the rows do not shift when a
                               filter makes the list short enough to fit */
 .sect{padding:8px 14px;font-size:10px;letter-spacing:.1em;
   text-transform:uppercase;color:var(--ok);
   background:color-mix(in srgb,var(--ok) 8%,transparent);
   border-bottom:1px solid var(--line)}
 .sect.no{color:var(--faint);background:transparent}
 .grp{border-bottom:1px solid var(--line)}
 .grphd{display:flex;align-items:center;gap:10px;padding:10px 14px;
   cursor:pointer}
 .grphd:hover{background:var(--med)}
 .grphd .cv{color:var(--faint);flex:none;width:10px}
 .grphd .gn{flex:1;font-size:12.5px;white-space:nowrap;overflow:hidden;
   text-overflow:ellipsis}
 .grphd .gv{color:var(--faint);font-size:10.5px;white-space:nowrap}
 .vars{display:none}
 .grp.open .vars{display:block}
 .var{display:flex;align-items:center;gap:10px;padding:7px 14px 7px 34px;
   cursor:pointer;font-size:11.5px;color:var(--dim)}
 .var:hover{background:var(--med);color:var(--fg)}
 .var .vn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .var .vs{color:var(--faint);font-size:10.5px;white-space:nowrap}
 .var .tag{margin:0}
 .var.no{opacity:.45}
 .var[aria-current=true]{color:var(--acc)}
 /* exo's rail is a WORKFLOW -- instances, then a picker with its options
    and a launch -- not a list of the disk. Fifty rows with a button on each
    was a catalogue pretending to be a control. */
 .loadhd{display:flex;justify-content:flex-end;color:var(--faint);
   font-size:10px;margin:-4px 0 8px}
 select{width:100%;font:inherit;font-size:11.5px;background:var(--bg);
   color:var(--fg);border:1px solid var(--line);border-radius:var(--r);
   padding:7px 8px}
 select:focus{outline:none;border-color:var(--acc)}
 .opt{margin:10px 0}
 .optlab{font-size:10px;letter-spacing:.1em;text-transform:uppercase;
   color:var(--faint);margin-bottom:5px}
 .opt input{width:88px;text-align:right}
 #pickinfo{margin-top:10px;font-size:10.5px;color:var(--dim)}
 #pickinfo .warn{color:var(--warn)}
 .lk{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:11px}
 .lk .lkn{flex:1;color:var(--dim);white-space:nowrap;overflow:hidden;
   text-overflow:ellipsis}
 .lk input,.lk select{width:84px;padding:3px 6px;font-size:11px;text-align:right}
 .lk.set .lkn{color:var(--acc)}
 .lk .rst{color:var(--faint);cursor:pointer;padding:0 3px;visibility:hidden}
 .lk.set .rst{visibility:visible}
 .lk .rst:hover{color:var(--warn)}
 .wired{margin-bottom:18px}
 .wiredbar{height:12px;background:var(--med);border-radius:2px;margin:9px 0;
   position:relative;overflow:hidden}
 .wiredbar i{position:absolute;top:0;bottom:0;left:0;background:var(--acc);
   opacity:.5}
 .wiredbar u{position:absolute;top:0;bottom:0;width:2px;
   background:var(--warn)}
 .wiredrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
 .wiredrow input[type=range]{flex:1;min-width:160px;accent-color:var(--acc)}
 .wiredrow output{font-weight:700;min-width:5.5em;text-align:right}
 .wired .msg{margin-top:8px}
 .wired pre{user-select:all;background:var(--bg);border:1px solid var(--line);
   border-radius:var(--r);padding:8px 9px;margin-top:8px;color:var(--fg)}
 .wired .warn{color:var(--warn);font-size:11px;margin-top:6px}
 #pickinfo div{padding:2px 0}
 .other pre{margin:7px 0 2px;font-size:10px;user-select:all;
   background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
   padding:7px 8px;white-space:pre-wrap;word-break:break-all}
 .side{border-right:1px solid var(--line);padding-right:18px;min-width:0}
 .newchat{width:100%;text-align:left;color:var(--acc);border-style:dashed;
   cursor:pointer;margin-bottom:12px;font-size:11.5px;letter-spacing:.08em;
   text-transform:uppercase}
 .newchat:hover{border-color:var(--acc)}
 .chat{padding:8px 9px;border-radius:var(--r);cursor:pointer;margin-bottom:3px;
   border:1px solid transparent}
 .chat:hover{background:var(--med)}
 .chat[aria-current=true]{border-color:color-mix(in srgb,var(--acc) 40%,transparent);
   background:color-mix(in srgb,var(--acc) 8%,transparent)}
 .chat .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
 .chat .m{font-size:10px;color:var(--faint);letter-spacing:.04em;margin-top:3px}
 .chat .x{float:right;color:var(--faint);padding:0 2px;visibility:hidden}
 .chat:hover .x{visibility:visible}
 .chat .x:hover{color:var(--warn)}
 .sidelab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;
   color:var(--faint);margin:14px 0 7px}
 /* A menu takes the whole screen. Half a screen of settings beside a
    topology you are not reading is two things competing; this is one. */
 .sheet{position:fixed;inset:0;z-index:40;background:var(--bg);
   display:flex;flex-direction:column;
   background-image:linear-gradient(var(--grid) 1px,transparent 1px),
     linear-gradient(90deg,var(--grid) 1px,transparent 1px);
   background-size:40px 40px}
 .sheet[hidden]{display:none}
 .sheethd{display:flex;align-items:center;justify-content:space-between;
   padding:16px 24px;border-bottom:1px solid var(--line);flex:none;
   background:linear-gradient(180deg,oklch(.16 0 0/.95),oklch(.12 0 0/.98))}
 @media(prefers-color-scheme:light){.sheethd{
   background:linear-gradient(180deg,oklch(1 0 0/.95),oklch(.97 0 0/.98))}}
 .sheethd b{letter-spacing:.18em;color:var(--acc);text-shadow:var(--glow)}
 #sheetclose{background:transparent;border-color:var(--line);color:var(--dim);
   cursor:pointer;letter-spacing:.1em}
 #sheetclose:hover{color:var(--fg);border-color:var(--acc)}
 .sheetbody{overflow:auto;padding:26px 24px 60px}
 .sheetbody .panel{max-width:760px;margin:0 auto 20px}
 .sheetbody .panel{display:none}
 .sheetbody .panel.on{display:block}
 /* The sheet header already names the panel; the notch label would say it
    a second time, six lines lower. */
 .sheetbody .panel>.lab{display:none}
 .sheetbody .panel{padding-top:20px}
 nav a[aria-pressed=true]{color:var(--acc)}
 nav a{cursor:pointer;border-bottom:1px solid transparent;padding-bottom:2px}
 nav a[aria-pressed=true]{border-bottom-color:var(--acc)}
 nav a[aria-pressed=true]{text-shadow:var(--glow)}
 .panel{border:1px solid var(--line);border-radius:var(--r);
   padding:16px 18px 18px;position:relative;margin-bottom:20px;
   background:linear-gradient(180deg,oklch(.16 0 0/.95) 0%,oklch(.12 0 0/.98) 100%);
   box-shadow:inset 0 1px 0 oklch(1 0 0/.03),0 4px 20px oklch(0 0 0/.5)}
 @media(prefers-color-scheme:light){.panel{background:var(--panel);
   box-shadow:0 1px 3px oklch(0 0 0/.07)}}
 .lab{position:absolute;top:-7px;left:14px;background:var(--bg);padding:0 7px;
   font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--acc);
   font-weight:700}
 .lab:before{content:"\25c6  "}
 .row{display:flex;justify-content:space-between;gap:14px;padding:3px 0}
 .row>span:first-child{color:var(--dim)}
 /* --- topology: the device IS the gauge ---------------------------------- */
 /* exo draws the topology on a round CRT face -- a radial gradient with a
    heavy inner shadow, so the devices sit INSIDE a screen rather than on a
    background. The graph links are dashed and animate along their length,
    which is the one piece of motion that carries information: it says the
    link is live. */
 .topo{position:relative;display:flex;align-items:center;
   justify-content:center;padding:26px 10px 18px;margin:2px 0 4px;
   border-radius:var(--r);
   background:radial-gradient(ellipse at center,oklch(.16 0 0) 0%,
     oklch(.12 0 0) 50%,oklch(.09 0 0) 100%);
   box-shadow:inset 0 0 70px oklch(0 0 0/.5),0 0 40px oklch(.82 .14 185/.06)}
 @media(prefers-color-scheme:light){.topo{background:var(--med);box-shadow:none}}
 .flow{width:56px;height:20px;flex:none}
 .flow line{stroke:color-mix(in srgb,var(--acc) 40%,transparent);stroke-width:1.5;
   stroke-dasharray:8 8;animation:flow 1s linear infinite;
   filter:drop-shadow(0 0 3px color-mix(in srgb,var(--acc) 50%,transparent))}
 @keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-16}}

 .unit{text-align:center;padding:0 8px;flex:1 1 220px;max-width:380px}
 .unit .nm{font-size:11.5px;letter-spacing:.08em;color:var(--dim)}
 .unit .hw{font-size:10px;letter-spacing:.08em;color:var(--faint);
   margin:2px 0 8px;text-transform:uppercase}
 .ucard{display:flex;gap:10px;align-items:stretch;text-align:left;
   border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;
   background:color-mix(in srgb,var(--bg) 70%,transparent)}
 .unit.off .ucard{opacity:.45}
 .mlines{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
 .mhd{display:flex;justify-content:space-between;font-size:9.5px;
   letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
 .mhd b{color:var(--dim);font-weight:600;letter-spacing:.04em;text-transform:none}
 .sp{display:block;width:100%;height:22px}
 .noans{font-size:10.5px;color:var(--faint);margin:auto}
 /* The memory bar: segments stack from the bottom, and a hatched segment
    is memory that will be handed back when asked. */
 .stk{position:relative;width:26px;flex:none;display:flex;
   flex-direction:column-reverse;border:1px solid var(--line);
   border-radius:3px;overflow:hidden;min-height:120px}
 .stk i{display:block;flex:none;background:var(--c);opacity:.75}
 .stk i.hatch{opacity:.9;background:repeating-linear-gradient(135deg,
   color-mix(in srgb,var(--c) 70%,transparent) 0 2px,transparent 2px 5px)}
 .stk u{position:absolute;left:-1px;right:-1px;height:0;
   border-top:1px dashed var(--fg);opacity:.7}
 .stk.off{background:var(--grid)}
 .swap{color:var(--bad);font-weight:600;white-space:nowrap}

 .unit .stat{font-size:10.5px;color:var(--faint);margin-top:7px;letter-spacing:.04em}
 .unit .pct{font-size:15px;font-weight:700;color:var(--acc);
   text-shadow:var(--glow)}
 /* The free-space bar is gone. It was a third telling of a number the
    device gauges already draw and then print: a full-width chart that said
    less than the 66% next to the machine it belongs to, and cost more
    vertical room than the machines did. What is left is one summary line. */
 #mem{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;
   color:var(--dim);padding-top:12px}
 #mem b{color:var(--fg);font-weight:700}

<script>
// --- the menu -------------------------------------------------------------
// Settings are a thing you go and get, and when you get them they take the
// screen. The page therefore always OPENS closed. An earlier version
// remembered the last panel in localStorage, which quietly undid the point:
// open it once and it is open forever after.
(()=>{
  const sheet=document.getElementById('sheet');
  const links=[...document.querySelectorAll('nav a[data-panel]')];
  function show(name){
    const on=name && document.getElementById(name);
    sheet.hidden=!on;
    document.querySelectorAll('.sheetbody .panel').forEach(p=>
      p.classList.toggle('on', p.id===name));
    document.getElementById('sheettitle').textContent=name||'';
    links.forEach(a=>a.setAttribute('aria-pressed', a.dataset.panel===name));
    document.body.style.overflow=on?'hidden':'';
    if(on) sheet.querySelector('.sheetbody').scrollTop=0;
  }
  links.forEach(a=>a.onclick=()=>show(
    a.getAttribute('aria-pressed')==='true' ? null : a.dataset.panel));
  document.getElementById('sheetclose').onclick=()=>show(null);
  addEventListener('keydown',e=>{ if(e.key==='Escape') show(null) });
  show(null);
  window.knShow=show;
})();

// The knurled wheel, drawn rather than shipped as an image so the page stays
// one file. Teeth are trapezoids around the rim -- a knurl has flanks, and a
// ring of plain radial lines reads as a sun, not as something you grip.
//
// The word covers the wheel's middle, so the teeth that matter are the ones
// at the top and bottom of the circle. Those are the only part visible, and
// they are what makes the name sit ON a wheel rather than beside an icon.
(()=>{
  const g=document.getElementById('knurl'); if(!g) return;
  const cx=60, cy=60, r0=40, r1=56, n=12, half=(180/n)*0.52;
  // The band the word passes through. The wheel is MASKED out across it
  // rather than drawn behind it: a rim crossing the letters is clutter, and
  // the point is that the word is the axle the teeth turn around.
  let out=`<defs><mask id="wm" maskUnits="userSpaceOnUse"
      x="-40" y="-40" width="200" height="200">
      <rect x="-40" y="-40" width="200" height="200" fill="#fff"/>
      <rect x="-40" y="${cy-21}" width="200" height="42" fill="#000"/>
    </mask></defs><g mask="url(#wm)">`;
  for(let i=0;i<n;i++){
    const a=(360/n)*i, p=[];
    for(const [rad,off] of [[r0,-half*1.55],[r1,-half],[r1,half],[r0,half*1.55]]){
      const t=(a+off)*Math.PI/180;
      p.push(`${(cx+rad*Math.sin(t)).toFixed(2)},${(cy-rad*Math.cos(t)).toFixed(2)}`);
    }
    out+=`<polygon points="${p.join(' ')}" fill="var(--acc)" opacity=".6"/>`;
  }
  out+=`<circle cx="${cx}" cy="${cy}" r="${r0}" fill="none"
        stroke="var(--acc)" stroke-width="3" opacity=".6"/></g>`;
  g.innerHTML=out;
})();

const GIB=1073741824, $=id=>document.getElementById(id);
let LASTWS=0;   // this box's working set, learned from the first status
const gb=b=>Number.isFinite(b)?(b/GIB).toFixed(1)+' GiB':'--';
const row=(k,v)=>`<div class="row"><span>${k}</span><span>${v}</span></div>`;
const esc=s=>String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

// --- settings -------------------------------------------------------------
// Three things kept apart: what is RUNNING, what a tune WOULD give, and how
// far a change can reach. Reach is per knob and was measured by reading a
// bundled runtime: two apply live, eight are compiled into the kernel at
// import, and one is not read by these runtimes at all.
let DOC={}, ASK={};
function knobHTML(k){
  const v=k.changed
    ? `<span class="was">${esc(k.running)}</span><span class="chg">${esc(k.would_be)}</span>`
    : esc(k.running??k.would_be);
  const tag=k.reach==='live'?'<span class="tag live">live</span>'
    :k.reach==='no-effect'?'<span class="tag dead">no effect</span>':'';
  return `<div class="knob" onclick="this.toggleAttribute('open')">
    <div class="hd"><span class="k">${k.name}${tag}</span><span class="val">${v}</span></div>
    <div class="why">${esc(k.what)}${k.why?' — '+esc(k.why):''}
      <br><span style="color:var(--faint)">${esc(k.reach_why)}</span></div></div>`;
}
// A knurl is the crosshatch cut into metal so a hand can grip a machined
// part, so the control is a knob with a knurled rim rather than a slider.
// It is not decoration: the positions are DISCRETE because the measurements
// are, and the rim stops turning where the evidence stops -- 32 on the decode
// chunk because nothing above it was ever faster, and at whatever the box's
// headroom allows for the cache. A control that lets you choose a setting the
// resolver would refuse is a control that lies.
const A0=-135, A1=135;                       // sweep, degrees
function dial(k){
  const vals=k.values, idx=Math.max(0,vals.findIndex(v=>String(v)===String(k.running)));
  const capIdx=k.cap==null?vals.length-1:vals.findIndex(v=>String(v)===String(k.cap));
  const ang=i=>A0+(A1-A0)*(vals.length<2?0:i/(vals.length-1));
  const pt=(a,r)=>[36+r*Math.sin(a*Math.PI/180), 36-r*Math.cos(a*Math.PI/180)];
  let ticks='';
  vals.forEach((v,i)=>{
    const [x1,y1]=pt(ang(i),27), [x2,y2]=pt(ang(i),31);
    const dead=i>capIdx;
    ticks+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${
      dead?'var(--line)':(i<=idx?'var(--acc)':'var(--faint)')}" stroke-width="1.6"
      stroke-linecap="round"/>`;
  });
  let knurl='';                              // the grip itself
  for(let a=-180;a<180;a+=5){
    const [x1,y1]=pt(a,17.5), [x2,y2]=pt(a,22);
    knurl+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"
      stroke="var(--faint)" stroke-width=".85" opacity=".55"/>`;
  }
  const [px,py]=pt(ang(idx),16.5);
  const unit=k.unit?`<em>${esc(k.unit)}</em>`:'';
  const pend=k.changed?`<span class="pend">→ ${esc(k.would_be)}</span>`:'';
  return `<div class="dial" data-name="${esc(k.name)}" data-idx="${idx}"
      data-cap="${capIdx}" tabindex="0">
    <svg viewBox="0 0 72 72" width="94" height="94">
      ${ticks}
      <circle cx="36" cy="36" r="22" fill="color-mix(in srgb,var(--fg) 5%,transparent)"
        stroke="var(--line)"/>
      ${knurl}
      <circle cx="36" cy="36" r="17.5" fill="var(--bg)" stroke="var(--line)"/>
      <line class="ptr" x1="36" y1="36" x2="${px}" y2="${py}" stroke="var(--acc)"
        stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="36" cy="36" r="1.6" fill="var(--faint)"/>
    </svg>
    <div class="vv">${esc(k.running)}${unit} ${pend}</div>
    <div class="nm">${esc(k.name.replace(/^(VQ|VQLAB|KNURLOGIC)_/,''))}</div>
  </div>`;
}
function wireDials(){
  // Mutate the live node, never re-render it mid-gesture. Replacing the
  // element with outerHTML destroyed the very element holding the pointer
  // capture, so pointerup never fired and the turn was never applied -- the
  // knob moved on screen and nothing happened underneath, which is the one
  // behaviour a control must never have.
  document.querySelectorAll('.dial').forEach(el=>{
    const k=(DOC.knobs||[]).find(x=>x.name===el.dataset.name); if(!k) return;
    const cap=+el.dataset.cap, svg=el.querySelector('svg');
    const ticks=[...svg.querySelectorAll('line')].slice(0,k.values.length);
    const ptr=svg.querySelector('.ptr'), vv=el.querySelector('.vv');
    let idx=+el.dataset.idx, startY=0, startIdx=0, dragging=false;
    const ang=i=>A0+(A1-A0)*(k.values.length<2?0:i/(k.values.length-1));
    const draw=()=>{
      const a=ang(idx)*Math.PI/180;
      ptr.setAttribute('x2', 36+16.5*Math.sin(a));
      ptr.setAttribute('y2', 36-16.5*Math.cos(a));
      ticks.forEach((t,i)=>t.setAttribute('stroke',
        i>cap?'var(--line)':(i<=idx?'var(--acc)':'var(--faint)')));
      const moved=String(k.values[idx])!==String(k.running);
      vv.innerHTML=`${k.values[idx]}${k.unit?`<em>${k.unit}</em>`:''}`+
        (moved?' <span class="pend">•</span>':'');
    };
    const set=i=>{ i=Math.max(0,Math.min(cap,i)); if(i!==idx){ idx=i; draw(); } };
    svg.addEventListener('pointerdown',e=>{
      dragging=true; startY=e.clientY; startIdx=idx;
      svg.setPointerCapture(e.pointerId); e.preventDefault();
    });
    svg.addEventListener('pointermove',e=>{
      if(dragging) set(startIdx+Math.round((startY-e.clientY)/14));
    });
    const stop=()=>{ if(!dragging) return; dragging=false;
      if(String(k.values[idx])!==String(k.running))
        applyKnob(k.name,k.values[idx]); };
    svg.addEventListener('pointerup',stop);
    svg.addEventListener('pointercancel',stop);
    el.addEventListener('keydown',e=>{
      const d={ArrowUp:1,ArrowRight:1,ArrowDown:-1,ArrowLeft:-1}[e.key];
      if(!d) return; e.preventDefault(); set(idx+d);
      if(String(k.values[idx])!==String(k.running))
        applyKnob(k.name,k.values[idx]);
    });
  });
}
async function applyKnob(name,value){
  const r=await (await fetch('/settings.json',{method:'POST',
    body:JSON.stringify({[name]:value})})).json();
  const what=(r.applied||{})[name];
  $('applies').innerHTML=what?`<b>${esc(name)}</b> ${esc(what)}`:'Nothing changed.';
  loadSettings({tune:ASK.tune||'',working_set_gib:$('ws').value||''});
}
// The wired limit: what the GPU may hold, which decides whether a rung
// loads at all. knurlogic NEVER runs the sysctl -- it reads the current
// value, works out where the ceiling is, and hands over the exact line.
// A soft gate, like everything else here: past what it recommends you get
// the command and a warning rather than a refusal.
function renderMachine(){
  const el=$('machine'); if(!el) return;
  const w=DOC.wired||{};
  if(!w.known){ el.innerHTML=''; return }
  const cur=DOC.wired_current_gib, rec=DOC.wired_recommended_gib,
        inst=DOC.wired_installed_gib, tgt=DOC.wired_target_gib;
  const max=Math.round(inst-4);
  el.innerHTML=`<div class="wired">
    <div class="sidelab" style="margin-top:0">wired limit · ${esc(w.key)}</div>
    <div class="wiredbar"><i style="width:${(100*tgt/inst).toFixed(1)}%"></i>
      <u style="left:${(100*rec/inst).toFixed(1)}%" title="recommended"></u></div>
    <div class="wiredrow">
      <input type="range" id="wslider" min="8" max="${max}" step="1"
        value="${Math.round(tgt)}">
      <output id="wout">${tgt.toFixed(0)} GiB</output>
    </div>
    <div class="msg">now <b>${cur.toFixed(0)}</b> of ${inst.toFixed(0)} GiB
      installed · knurlogic suggests <b>${rec.toFixed(0)}</b>, leaving
      ${(inst-rec).toFixed(0)} for macOS</div>
    ${DOC.wired_warn?`<div class="warn">${esc(DOC.wired_warn)}</div>`:''}
    ${DOC.wired_command
      ? `<pre>${esc(DOC.wired_command)}</pre>`
      : `<div class="msg">that is what it is set to now</div>`}
  </div>`;
  const sl=$('wslider');
  sl.oninput=()=>{ $('wout').textContent=sl.value+' GiB' };
  // Only ask the server when the drag STOPS: it recomputes the command and
  // the warning, and a request per pixel is a request per pixel.
  sl.onchange=()=>loadSettings({...(ASK.tune?{tune:ASK.tune}:{}),
                                wired_gib:sl.value});
}

async function loadSettings(q){
  const qs=new URLSearchParams(q||{}).toString();
  try{ DOC=await (await fetch('/settings.json'+(qs?'?'+qs:''))).json() }
  catch(e){ DOC={} }
  ASK=DOC.asked||{};
  renderMachine();
  // Without an artifact there are no knobs to show: they are read by a
  // bundled runtime and mean nothing on their own. Hiding the controls beats
  // an empty frame with an Apply button in it.
  const hasKnobs=(DOC.knobs||[]).length>0;
  ['artifactctl','dials','dialnotes','knobs','applies'].forEach(id=>{
    const e=$(id); if(e) e.style.display=hasKnobs?'':'none';
  });
  document.querySelectorAll('#settings details.more').forEach(d=>{
    d.style.display=hasKnobs?'':'none';
  });
  if(!hasKnobs) return;
  $('tunes').innerHTML='';
  (DOC.tunes||[]).forEach(t=>{
    const b=document.createElement('button');
    b.textContent=t.name; b.title=t.why;
    b.setAttribute('aria-pressed',t.name===ASK.tune);
    b.onclick=()=>loadSettings({tune:t.name,working_set_gib:$('ws').value||''});
    $('tunes').appendChild(b);
  });
  if(document.activeElement!==$('ws'))
    $('ws').value=(ASK.working_set_bytes/GIB).toFixed(0);

  // Tiered by who would reach for it, not by what happens to have changed:
  // the memory knobs are the page, the measured flags are a click away, and
  // the kernel internals are named but never defaulted.
  const ks=DOC.knobs||[];
  const dialable=ks.filter(k=>k.values&&k.reach==='live');
  $('dials').innerHTML=dialable.map(dial).join('');
  wireDials();
  // The cap belongs on its own line, not wrapped four deep under a 94px
  // knob: it is a sentence, and a sentence needs the width of the row.
  $('dialnotes').innerHTML=dialable.filter(k=>k.cap!=null).map(k=>
    `<div class="capnote"><b>${esc(k.name.replace(/^(VQ|VQLAB|KNURLOGIC)_/,''))}
     </b> stops at ${esc(k.cap)} — ${esc(k.cap_why)}</div>`).join('');
  const dialled=new Set(ks.filter(k=>k.values&&k.reach==='live').map(k=>k.name));
  const shown=ks.filter(k=>!dialled.has(k.name)&&
    (k.tier==='reach'||k.changed||k.reach==='live'));
  $('knobs').innerHTML=shown.map(knobHTML).join('');
  $('rest').innerHTML=ks.filter(k=>!shown.includes(k)).map(knobHTML).join('');
  const un=DOC.unmanaged||[];
  // An empty <details> still renders the browser's default "Details"
  // marker, which is a row that says nothing.
  $('unmanaged').style.display=un.length?'':'none';
  $('unmanaged').innerHTML=un.length
    ? `<summary>${un.length} more this runtime reads</summary>
       <div class="msg">knurlogic has no measured answer for these, so it sets
       none of them and the runtime's own defaults apply.</div>
       <div class="k" style="color:var(--faint);margin-top:8px;line-height:1.9">
       ${un.map(u=>esc(u.name)).join('  ')}</div>` : '';
  $('env').textContent=DOC.exports||'';

  // The endpoint is worthless until something is pointed at it, and the
  // pointing is four variables nobody remembers.
  const C=DOC.connect;
  if(C){
    const base=location.origin;
    const tabs={'claude code':C.claude, 'openai clients':C.openai};
    const draw=k=>{ $('conn').textContent=(tabs[k]||'').split('__BASE__').join(base);
      [...$('conntabs').children].forEach(b=>
        b.setAttribute('aria-pressed', b.textContent===k)); };
    $('conntabs').innerHTML='';
    Object.keys(tabs).forEach((k,i)=>{
      const b=document.createElement('button');
      b.textContent=k; b.onclick=()=>draw(k); $('conntabs').appendChild(b);
      if(i===0) setTimeout(()=>draw(k),0);
    });
  }

  const chg=ks.filter(k=>k.changed);
  const live=chg.filter(k=>k.reach==='live'), rest=chg.filter(k=>k.reach==='restart');
  $('apply').disabled=!live.length;
  $('applies').innerHTML = !chg.length
    ? `Running <b>${esc(ASK.tune)}</b>.`
    : (live.length?`<b>${live.length}</b> can be applied now. `:'')+
      (rest.length?`<b>${rest.length}</b> need${rest.length===1?'s':''} a restart:
        <code>--tune ${esc(ASK.tune)}</code>`:'');
}
$('apply').onclick=async()=>{
  $('apply').disabled=true;
  const r=await (await fetch('/settings.json',{method:'POST',
    body:JSON.stringify({tune:ASK.tune})})).json();
  const done=Object.entries(r.applied||{}).filter(([k,v])=>!/restart/.test(v));
  $('applies').innerHTML=done.map(([k,v])=>`<b>${esc(k)}</b> ${esc(v)}`).join('<br>')
    ||'Nothing changed.';
  setTimeout(()=>loadSettings({tune:ASK.tune,working_set_gib:$('ws').value||''}),400);
};
$('ws').addEventListener('change',()=>loadSettings({tune:ASK.tune||'',working_set_gib:$('ws').value}));

// --- status ---------------------------------------------------------------
function setState(ok, text){
  const el=$('state');
  el.classList.toggle('off', !ok);
  el.lastElementChild.textContent=text;
}
async function tick(){
  let d;
  try{ d=await (await fetch('/status.json')).json() }
  catch(e){ setState(false,'no answer'); return }
  const a=d.artifact, m=d.memory, C=d.cluster;
  // In a cluster the honest reading is how many nodes ANSWERED, not that
  // the page it is drawn on is up.
  const ns=d.nodes||[], up=ns.filter(n=>n.reachable!==false).length;
  setState(up===ns.length, ns.length>1 ? `${up}/${ns.length} nodes`
    : (up ? 'serving' : 'no answer'));
  // Nothing loaded is a STATE, not a page still loading, and the bench has
  // nothing to send a prompt to -- so it goes rather than sitting there with
  // a button that would fail.
  // The chat talks to whatever is running (exo, or a server `load` started)
  // through this page's /chat proxy, so it stays even when this page serves
  // nothing; the bench speaks to this page's own endpoint and goes.
  $('try').style.display='';
  const bt=document.querySelector('#ptabs [data-tab="bench"]');
  if(bt) bt.style.display=a?'':'none';
  if(!a && window.ACTIVETAB==='bench' && window.switchTab) window.switchTab('chat');
  $('mem').style.display=a?'':'none';
  $('served').style.display=a?'':'none';
  if(!a){ $('title').textContent='no model loaded';
    $('sub').textContent='';
    $('badges').innerHTML=''; }
  if(a){ $('title').textContent=a.name;
    $('sub').textContent=`${a.model_type} · ${gb(a.size_bytes)}`;
    const b=[];
    if(a.is_vq) b.push(['VQ',1]);
    if(a.bundled_runtime) b.push([a.bundled_runtime,1]);
    (d.architectures||[]).forEach(r=>b.push([r.module+' '+r.state,
      r.state==='OK'||r.state==='UNPINNED']));
    $('badges').innerHTML=b.map(([t,on])=>
      `<span class="badge${on?' on':''}">${esc(t)}</span>`).join('');
  }
  if(window.chatServedChanged) window.chatServedChanged(a);
  // Each node is a card: its name overhead, what the hardware IS in words
  // (a chip and a size say more than a drawing of a laptop), the lines that
  // explain slow tokens on the left, and on the right a bar of where its
  // memory went. The old device pictures filled with one colour and could
  // not say whether the box was hot, swapping or busy; these can.
  //
  // A line from a missing reading is drawn as a GAP, never as zero: a probe
  // that failed is not an idle GPU.
  function spark(vals, col){
    const W=200, H=30, n=vals.length;
    if(!n || vals.every(v=>v==null))
      return `<svg class="sp" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"></svg>`;
    // What history there is spans the width; a new page is not a dash in
    // the corner for three minutes.
    const x=i=>n<2?W:i/(n-1)*W,
          y=v=>H-1-Math.max(0,Math.min(100,v))/100*(H-2);
    let line='', area='', run=[];
    const flush=()=>{ if(!run.length) return;
      line+='M'+run.map(([i,v])=>`${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join('L');
      area+=`M${x(run[0][0]).toFixed(1)} ${H}`+
        run.map(([i,v])=>`L${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join('')+
        `L${x(run[run.length-1][0]).toFixed(1)} ${H}Z`;
      run=[] };
    vals.forEach((v,i)=>{ if(v==null) flush(); else run.push([i,v]) });
    flush();
    return `<svg class="sp" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <path d="${area}" fill="${col}" opacity=".13"/>
      <path d="${line}" fill="none" stroke="${col}" stroke-width="1.4"
        vector-effect="non-scaling-stroke"/></svg>`;
  }
  const THERMCOL={nominal:'var(--ok)', fair:'var(--warn)',
                  serious:'var(--bad)', critical:'var(--bad)'};
  function lines(mx){
    const h=(mx&&mx.history)||[], now=(mx&&mx.now)||{};
    const row=(lab,val,cls,vals,col)=>`<div class="mrow">
      <div class="mhd"><span>${lab}</span><b class="${cls||''}">${val}</b></div>
      ${vals?spark(vals,col):''}</div>`;
    const pc=v=>v==null?'--':Math.round(v)+'%';
    const th=now.thermal;
    return row('gpu', pc(now.gpu_pct)+(now.gpu_in_use_bytes!=null
          ?` · ${gb(now.gpu_in_use_bytes)}`:''), '',
        h.map(s=>s.gpu_pct), 'var(--acc)')+
      row('cpu', pc(now.cpu_pct), '', h.map(s=>s.cpu_pct), 'var(--warn)')+
      row('memory', pc(now.memory_pct), '', h.map(s=>s.memory_pct), '#bb9af7')+
      row('thermal', th||'--', 'th', null)
        .replace('class="th"', `class="th" style="color:${THERMCOL[th]||'var(--faint)'}"`);
  }
  // Bottom up: knurlogic's weights, knurlogic's cache (hatched, because it
  // is reclaimable), each other runtime in its own colour, everything else
  // on the box, then free. Only knurlogic can split weights from cache --
  // it asks its own allocator; every other runtime is one footprint, drawn
  // solid rather than guessed at.
  function segs(n, mm, ws){
    const nm=n.memory||{}, by=Object.entries(mm.by_runtime||{})
      .sort((a,b)=>(a[0]==='knurlogic'?-1:b[0]==='knurlogic'?1:b[1]-a[1]));
    const out=[];
    for(const [k,v] of by){
      if(k==='knurlogic' && nm.scope==='process' && nm.available){
        const w=Math.min(nm.active_bytes||0, v),
              c=Math.min(nm.cache_bytes||0, Math.max(v-w,0));
        out.push(['knurlogic weights', w, RAMCOL.knurlogic, '']);
        out.push(['knurlogic cache', c, RAMCOL.knurlogic, 'hatch']);
        if(v-w-c>0) out.push(['knurlogic', v-w-c, RAMCOL.knurlogic, '']);
      } else out.push([k, v, RAMCOL[k]||'var(--dim)', '']);
    }
    const used=Number.isFinite(mm.used_bytes)?mm.used_bytes:(mm.seen_bytes||0);
    const named=by.reduce((x,[,v])=>x+v,0);
    out.push(['everything else', Math.max(used-named,0), 'var(--faint)', '']);
    const tot=out.reduce((x,s)=>x+s[1],0);
    // Footprints can overrun the OS's own used figure; scale to fit rather
    // than draw past the top of the machine.
    return tot>ws ? out.map(s=>[s[0],s[1]*ws/tot,s[2],s[3]]) : out;
  }
  function stack(n, mm, off){
    if(off) return '<div class="stk off"></div>';
    const nm=n.memory||{};
    if(!mm||!mm.installed_bytes){
      // No map from this node: one band of what it reported, nothing split.
      const ws=nm.working_set_bytes||1, f=100*(nm.active_bytes||0)/ws;
      return `<div class="stk"><i style="height:${f.toFixed(1)}%;
        background:var(--dim)" title="in use ${gb(nm.active_bytes||0)}"></i></div>`;
    }
    const inst=mm.installed_bytes;
    const ss=segs(n, mm, inst).filter(s=>s[1]/inst>0.003);
    // The GPU cannot wire all of installed memory; a model has to fit under
    // this line, so it is drawn where a person would look for it.
    const lim=nm.working_set_bytes && nm.working_set_bytes<inst*.99
      ? `<u style="bottom:${(100*nm.working_set_bytes/inst).toFixed(1)}%"
          title="GPU limit ${gb(nm.working_set_bytes)}"></u>` : '';
    return `<div class="stk">${ss.map(([k,b,c,cls])=>
      `<i class="${cls}" style="height:${(100*b/inst).toFixed(2)}%;--c:${c}"
        title="${esc(k)} ${gb(b)}"></i>`).join('')}${lim}</div>`;
  }
  function unit(n){
    const nm=n.memory||{}, hw=n.machine||{};
    const mm=n.memory_map||(n.role==='local'||n.role==='server'?RAM:null);
    const mapped=!!(mm&&mm.installed_bytes);
    const inst=(mapped?mm.installed_bytes:nm.working_set_bytes)||0;
    const used=mapped?(mm.used_bytes||mm.seen_bytes||0):(nm.active_bytes||0);
    const off=n.reachable===false||(!nm.available&&!mapped);
    const pct=inst?Math.max(0,Math.min(100,100*used/inst)):0;
    const swap=((n.metrics||{}).now||{}).swap_bytes;
    const what=[hw.chip||hw.model||'', inst?gb(inst).replace(/\.\d+ /,' '):'']
      .filter(Boolean).join(' · ');
    return `<div class="unit${off?' off':''}">
      <div class="nm">${esc(n.node)}</div>
      <div class="hw">${esc(what)||'&nbsp;'}</div>
      <div class="ucard">
        <div class="mlines">${off?'<div class="noans">no answer</div>'
          : (n.metrics?.history||[]).length?lines(n.metrics)
          : '<div class="noans">no metrics from this node</div>'}</div>
        ${stack(n, mapped?mm:null, off)}
      </div>
      <div class="stat"><span class="pct">${off?'--':pct.toFixed(0)+'%'}</span>
        ${off?'':gb(used)+' / '+gb(inst)}${swap>(64<<20)
          ?` <span class="swap">· ${gb(swap)} swap</span>`:''}</div>
    </div>`;
  }
  // The link between nodes animates along its length. That is the only
  // motion on the page that carries information -- it says the link is
  // live -- so it is also the only one, and it stops under reduced-motion.
  //
  // It is drawn for TWO nodes and no more. Chaining it between three or
  // four would draw a line, and a line is not the shape of the cluster --
  // the nodes are not wired in series. With two, a connector is the truth;
  // past two it is a picture of a topology that does not exist, and it also
  // dangles off the end of every row that wraps.
  const ns_=d.nodes||[];
  // The key in the rail is a key to THESE machines, so it is the sum of the
  // maps they reported. A key whose numbers are one box's while the picture
  // is four is worse than no key.
  const maps=ns_.map(n=>n.memory_map).filter(Boolean);
  if(maps.length){
    const merged={installed_bytes:0, seen_bytes:0, other_bytes:0,
                  free_bytes:0, used_bytes:0, by_runtime:{}, nodes:maps.length};
    for(const m of maps){
      merged.installed_bytes+=m.installed_bytes||0;
      merged.seen_bytes+=m.seen_bytes||0;
      merged.other_bytes+=m.other_bytes||0;
      merged.free_bytes+=m.free_bytes||0;
      merged.used_bytes+=m.used_bytes||0;
      for(const [k,v] of Object.entries(m.by_runtime||{}))
        merged.by_runtime[k]=(merged.by_runtime[k]||0)+v;
    }
    // knurlogic's reclaimable share, keyed beside its runtime row: the only
    // runtime whose cache can be told apart from its weights.
    merged.knurlogic_cache=ns_.reduce((x,n)=>{const q=n.memory||{};
      return x+(q.scope==='process'&&q.available&&(n.memory_map||{})
        .by_runtime?.knurlogic ? (q.cache_bytes||0) : 0)},0);
    ramWent(merged);
  }
  $('topo').innerHTML=ns_.map(unit).join(ns_.length===2
    ? '<svg class="flow" viewBox="0 0 56 20" aria-hidden="true">'+
      '<line x1="2" y1="10" x2="54" y2="10"/></svg>'
    : '');
  // One line under the machines. The gauges carry the split; this carries
  // the totals, and only the figures that are not already drawn above.
  if(m&&m.available){
    LASTWS=(d.nodes||[]).reduce((x,n)=>Math.max(
      x,(n.memory||{}).working_set_bytes||0), 0)||m.working_set_bytes||0;
    const box=m.scope==='box', bit=(k,v)=>`<span>${k} <b>${v}</b></span>`;
    $('mem').innerHTML=
      bit(box?'in use':'weights + live', gb(m.active_bytes))+
      bit('cache', gb(m.cache_bytes))+
      bit('free', gb(m.headroom_bytes))+
      (C&&C.nodes_total>1
        ? bit('nodes', `${C.nodes_reachable}/${C.nodes_total}`)
        : Number.isFinite(m.peak_bytes) ? bit('peak', gb(m.peak_bytes)) : '');
  }
  const w=d.wired;
  if(w&&w.action==='raise'&&w.command)
    $('mem').innerHTML+=`<div class="msg">The GPU may wire only
      <b>${gb(w.limit_bytes)}</b> of ${gb(w.total_bytes)} installed.
      <code style="user-select:all">${esc(w.command)}</code></div>`;
}
// --- what else is here ----------------------------------------------------
// Shown, not offered: a loaded model is loaded, and a page that presents a
// list of models as if any of them could be clicked into service would be
// promising something the runtime cannot do. What it can hand over is the
// command, which is why the row opens one.
// Runs AFTER the first status, not beside it: "fits this box" needs the
// working set, and two fetches racing means the list is sorted against zero
// about half the time.
// --- load model -----------------------------------------------------------
// One picker, its options, and a launch -- exo's shape. The previous version
// listed seven models with a button on each and "+46 more", which is a
// catalogue pretending to be a control: the answer to fifty rungs is a
// picker, not a longer list.
let MODELS=[], GROUPS=[], FAM='All', SEL=null, QUERY='';
// Favorites/recents: a set of starred paths and a 20-entry most-recent list,
// both in localStorage (the idea is exo's picker; the code is ours).
function loadFav(){ try{ return new Set(JSON.parse(localStorage.getItem('kn.fav')||'[]')) }
  catch(e){ return new Set() } }
function isFav(p){ return loadFav().has(p) }
function toggleFav(p){ const s=loadFav();
  s.has(p)?s.delete(p):s.add(p);
  try{ localStorage.setItem('kn.fav', JSON.stringify([...s])) }catch(e){} }
function loadRecents(){ try{ return JSON.parse(localStorage.getItem('kn.recent')||'[]') }
  catch(e){ return [] } }
function pushRecent(path){
  let r=loadRecents().filter(x=>x.path!==path);
  r.unshift({path, at:Date.now()});
  try{ localStorage.setItem('kn.recent', JSON.stringify(r.slice(0,20))) }catch(e){}
}
// No `vision` field exists on /models.json today (checked `web.py`); this is
// a family-name heuristic until the server adds one, matching the families
// the design doc names as vision-capable (gemma4, glm5, qwen-vl). See the
// deviation note in the build report.
function isVision(m){
  // The server's answer, never a guess from the name: /models.json carries
  // `vision` per model and /status.json the served VisionSpec. A name
  // heuristic missed every Qwen rung (no "vl" in the name).
  return !!(m && m.vision);
}
window.isVision=isVision;

// Grouping, tested against the real disk before any of this was drawn: 49
// artifacts collapse to 13 rows. Publishers name a rung by its quantisation
// -- `-8bit`, `-VQ-3.1bpw`, `-bf16` -- so stripping the publisher prefix and
// that tail leaves the model, and the rungs of one model gather under it.
const _PUB=/^[^/]*?(?:--|\/)/;
const _TAIL=/[-_]?(?:vq[-_])?(?:\d+(?:\.\d+)?bpw|\d+bit|bf16|fp16|mlx|vq[-_]base|base|q\d+|instruct|it)\b.*$/i;
// A name that parses to nothing shared and carries no publisher is a LOCAL
// BUILD -- qwen4exp_vq_packed_mixL01p4q is not a model anybody publishes.
// Left ungrouped they were 14 rows of one, which is the wall again.
const ARCHLABEL={qwen4_exp_text:'Qwen3.8 Flash-Next', qwen3_5_moe_text:'Qwen3.5 MoE',
  qwen3_5_text:'Qwen3.8 27B', glm5_next_text:'GLM-5.3 Flash',
  gemma4_text:'Gemma 4', deepseek_v4:'DeepSeek V4'};
const FAMS=[[/glm/,'GLM'],[/deepseek/,'DeepSeek'],[/gemma/,'Gemma'],
            [/qwen/,'Qwen'],[/llama/,'Meta'],[/mistral/,'Mistral']];
function famOf(m){
  const hay=`${m.name} ${m.model_type||''}`.toLowerCase();
  for(const [re,name] of FAMS) if(re.test(hay)) return name;
  return 'Other';
}
function baseOf(n){ return n.replace(_PUB,'').replace(_TAIL,'')
  .replace(/^[-_\s]+|[-_\s]+$/g,'') || n }

function regroup(){
  const bases={}, count={};
  MODELS.forEach(m=>{ const b=baseOf(m.name); bases[m.name]=b;
    count[b]=(count[b]||0)+1 });
  const by={};
  MODELS.forEach(m=>{
    let key=bases[m.name];
    const published=m.name.includes('--')||m.name.includes('/');
    if(count[key]===1 && !published)
      key=`${ARCHLABEL[m.model_type]||m.model_type||'unknown'} · local builds`;
    (by[key]=by[key]||[]).push(m);
  });
  GROUPS=Object.entries(by).map(([name,ms])=>{
    ms.sort((a,b)=>b.size_bytes-a.size_bytes);
    return {name, ms, fam:famOf(ms[0]),
            lo:Math.min(...ms.map(m=>m.size_bytes)),
            hi:Math.max(...ms.map(m=>m.size_bytes))};
  }).sort((a,b)=>b.hi-a.hi);
}

function renderPicker(){
  const ws=LASTWS||0;
  const q=QUERY.trim().toLowerCase();
  const famCount={};
  GROUPS.forEach(g=>famCount[g.fam]=(famCount[g.fam]||0)+1);
  $('pfams').innerHTML=['All',...Object.keys(famCount).sort()].map(f=>
    `<div class="fam" data-f="${esc(f)}" aria-current="${f===FAM}">${esc(f)}
      <i>${f==='All'?GROUPS.length:famCount[f]}</i></div>`).join('');
  $('pfams').querySelectorAll('.fam').forEach(e=>e.onclick=()=>{
    FAM=e.dataset.f; renderPicker() });

  const shown=GROUPS.filter(g=>(FAM==='All'||g.fam===FAM) &&
    (!q || g.name.toLowerCase().includes(q) ||
     g.ms.some(m=>m.name.toLowerCase().includes(q))));
  const fits=g=>!ws||g.lo<=ws;
  const rng=g=>g.ms.length===1 ? gb(g.hi)
    : `${g.ms.length} variants (${(g.lo/GIB).toFixed(0)}–${(g.hi/GIB).toFixed(0)} GiB)`;
  const grp=g=>`<div class="grp" data-g="${esc(g.name)}">
      <div class="grphd"><span class="cv">›</span>
        <span class="gn">${esc(g.name)}</span>
        <span class="gv">${rng(g)}</span></div>
      <div class="vars">${g.ms.map(m=>{
        const ok=!ws||m.size_bytes<=ws;
        return `<div class="var ${ok?'':'no'}" data-p="${esc(m.path)}"
          aria-current="${SEL&&SEL.path===m.path}">
          <span class="star" data-fav="${esc(m.path)}"
            title="favorite">${isFav(m.path)?'★':'☆'}</span>
          <span class="vn">${esc(m.name)}</span>
          ${m.is_vq?'<span class="tag">VQ</span>':''}
          ${m.mtp?'<span class="tag">MTP</span>':''}
          ${isVision(m)?'<span class="tag">VISION</span>':''}
          <span class="vs">${gb(m.size_bytes)}</span></div>`}).join('')}</div>
    </div>`;
  const a=shown.filter(fits), b=shown.filter(g=>!fits(g));
  // Favorites and recents, shown only on the unfiltered "All" view so they
  // never fight the search/family filters.
  let favHTML='';
  if(FAM==='All' && !q){
    const favMs=MODELS.filter(m=>isFav(m.path));
    const recMs=loadRecents().map(r=>MODELS.find(m=>m.path===r.path)).filter(Boolean);
    const oneRow=m=>`<div class="var" data-p="${esc(m.path)}"
        aria-current="${SEL&&SEL.path===m.path}">
        <span class="star" data-fav="${esc(m.path)}">${isFav(m.path)?'★':'☆'}</span>
        <span class="vn">${esc(m.name)}</span>
        ${isVision(m)?'<span class="tag">VISION</span>':''}
        <span class="vs">${gb(m.size_bytes)}</span></div>`;
    if(favMs.length) favHTML+=`<div class="sect">favorites</div>
      <div class="vars">${favMs.map(oneRow).join('')}</div>`;
    if(recMs.length) favHTML+=`<div class="sect">recent</div>
      <div class="vars">${recMs.map(oneRow).join('')}</div>`;
  }
  $('prows').innerHTML=favHTML+
    (a.length?`<div class="sect">fits in this machine's memory</div>`
      +a.map(grp).join(''):'')
    +(b.length?`<div class="sect no">needs more than ${gb(ws)}</div>`
      +b.map(grp).join(''):'')
    || '<div class="sect no">nothing matches</div>';

  $('prows').querySelectorAll('.grphd').forEach(h=>h.onclick=()=>
    h.parentElement.classList.toggle('open'));
  $('prows').querySelectorAll('[data-fav]').forEach(s=>s.onclick=e=>{
    e.stopPropagation(); toggleFav(s.dataset.fav); renderPicker();
  });
  $('prows').querySelectorAll('.var').forEach(v=>v.onclick=()=>{
    SEL=MODELS.find(m=>m.path===v.dataset.p);
    $('picker').hidden=true; document.body.style.overflow='';
    pickInfo();
  });
  // One group open is enough to show the shape without a wall of rungs.
  if(a.length===1||q) $('prows').querySelectorAll('.grp').forEach(
    g=>g.classList.add('open'));
  $('pbudget').innerHTML=ws?`<b>${gb(ws)}</b> to fill`:'';
}

async function loadModels(){
  let d; try{ d=await (await fetch('/models.json')).json() }catch(e){ return }
  window.ALLMODELS=d.models||[];
  MODELS=(d.models||[]).filter(m=>!m.serving && m.servable)
    .sort((a,b)=>b.size_bytes-a.size_bytes);
  $('diskcount').textContent=`${(d.models||[]).length} models`;
  regroup();
  const ws=LASTWS||0;
  if(!SEL) SEL=MODELS.find(m=>!ws||m.size_bytes<=ws)||null;
  pickInfo();
}
// What this artifact WOULD resolve to, fetched when the selection changes.
// The restart-only knobs are editable here and nowhere else: once a model is
// up they are facts. Anything left alone is not sent, so the resolver keeps
// its answer -- only what you actually moved becomes an override.
let PREVIEW=null, SETS={};
async function loadPreview(){
  const m=SEL; if(!m){ PREVIEW=null; $('loadknobs').innerHTML=''; return }
  const q=new URLSearchParams({artifact:m.path,
                               tune:window.LOADTUNE||'balanced'});
  try{ PREVIEW=await (await fetch('/settings.json?'+q)).json() }
  catch(e){ PREVIEW=null }
  renderLoadKnobs();
}
function renderLoadKnobs(){
  const el=$('loadknobs');
  const ks=(PREVIEW&&PREVIEW.knobs)||[];
  if(!ks.length){ el.innerHTML='<div class="msg">nothing to set</div>'; return }
  el.innerHTML=ks.map(k=>{
    const v=(k.name in SETS)?SETS[k.name]:k.value;
    const ctl=k.values&&k.values.length
      ? `<select data-k="${esc(k.name)}">${k.values.map(o=>
          `<option ${String(o)===String(v)?'selected':''}>${o}</option>`).join('')}</select>`
      : `<input data-k="${esc(k.name)}" value="${esc(v)}">`;
    return `<div class="lk ${k.name in SETS?'set':''}"
      title="${esc((k.what||'')+(k.why?' — '+k.why:''))}">
      <span class="lkn">${esc(k.name.replace(/^(VQ|VQLAB|KNURLOGIC)_/,''))}</span>
      ${ctl}<span class="rst" data-r="${esc(k.name)}">↺</span></div>`;
  }).join('');
  el.querySelectorAll('[data-k]').forEach(c=>c.onchange=()=>{
    const k=c.dataset.k, was=ks.find(x=>x.name===k);
    if(String(c.value)===String(was.value)) delete SETS[k];
    else SETS[k]=String(c.value);
    renderLoadKnobs();
  });
  el.querySelectorAll('[data-r]').forEach(c=>c.onclick=()=>{
    delete SETS[c.dataset.r]; renderLoadKnobs();
  });
}

function pickInfo(){
  const m=SEL, el=$('pickinfo');
  $('pickname').textContent=m?m.name:'choose a model';
  $('picksize').textContent=m?gb(m.size_bytes):'';
  if(!m){ el.innerHTML=''; $('launch').disabled=true; return }
  $('launch').disabled=false;
  const ws=LASTWS||0, fits=!ws||m.size_bytes<=ws;
  const tags=[m.is_vq?'VQ':'', m.mtp?'MTP':'', m.model_type]
    .filter(Boolean).map(esc).join(' · ');
  el.innerHTML=`<div>${tags}</div>`+
    (fits?'':`<div class="warn">${gb(m.size_bytes)} against a ${gb(ws)}

}
$('openpick').onclick=()=>{
  $('picker').hidden=false; document.body.style.overflow='hidden';

};
$('pclose').onclick=()=>{ $('picker').hidden=true;

$('psearch').oninput=e=>{ QUERY=e.target.value; renderPicker() };
addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('picker').hidden){
  $('picker').hidden=true; document.body.style.overflow='' }});

$('launch').onclick=async()=>{
  const m=SEL; if(!m) return;
  const b=$('launch'); b.disabled=true; b.textContent='Launching…';
  const j=await act({action:'load', target:m.path,
                     port:+$('loadport').value||undefined,
                     tune:(window.LOADTUNE||'balanced'),
                     sets:SETS});

    const st=(j.settings||{}).needs_restart||{};
    const n=Object.keys(st).length;
    if(n) alert(`Loaded. ${n} setting${n===1?'':'s'} could not be applied `+
      `without a restart:\n\n`+Object.entries(st).map(([k,v])=>
        `${k}  wants ${v.wanted}, running ${v.running}`).join('\n'));
  }
};
// The tune a model is launched WITH, which is a load-time decision: the
// eight kernel flags are read at import, so this is the one moment they can
// be chosen at all.
(()=>{
  const el=$('loadtune'); if(!el) return;
  window.LOADTUNE='balanced';
  el.innerHTML=['safe','balanced','fast'].map(t=>
    `<button data-t="${t}" aria-pressed="${t==='balanced'}">${t}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    window.LOADTUNE=b.dataset.t;
    el.querySelectorAll('button').forEach(x=>
      x.setAttribute('aria-pressed', x===b));

})();

// --- what is actually in memory, whoever put it there ---------------------
// exo's models, ollama's models and ours in one list. A machine has one pool
// of memory and every runtime is spending from it, so opening another tool's
// page to see what it is holding is a thing this should have made
// unnecessary.
// A runtime's own account of what it holds and the OS's account of what its
// processes cost are different numbers, and the gap is the thing that is
// hard to chase down by hand. Both are shown; neither is derived from the
// other.
let RAM=null;   // the memory map, shared with the topology's gauges
const RAMCOL={knurlogic:'var(--acc)', exo:'var(--warn)',
              ollama:'var(--ok)', 'mlx-lm':'#7aa2f7', 'mlx-vlm':'#bb9af7',
              vqlab:'#e0af68'};
function ramWent(m){
  const el=$('ramwent');
  RAM=m && m.installed_bytes ? m : null;
  if(!RAM){ el.innerHTML=''; return }
  const inst=m.installed_bytes, by=Object.entries(m.by_runtime||{})
    .sort((a,b)=>b[1]-a[1]);
  // DERIVED FROM ONE BASE, never carried alongside. This line used to take
  // `other` from other_bytes (which is used - named) and `free` from
  // installed - seen_bytes (the sum of process FOOTPRINTS). Two different
  // bases, so the rows summed to 118.7 GiB on a 96 GiB machine and the key
  // disagreed with the gauge beside it. Everything here now comes from
  // `installed` and `used` in the same object, so the rows add up to the
  // machine by construction.
  const used=Number.isFinite(m.used_bytes)?m.used_bytes:(m.seen_bytes||0);
  const named=by.reduce((x,[,v])=>x+v,0);
  const other=Math.max(used-named,0);
  const free=Math.max(inst-used,0);
  const row=(k,b,c)=>`<div class="ramrow">${
    c?`<em style="background:${c}"></em>`
     :'<em style="border:1px solid var(--line)"></em>'}<span>${k}</span>
    <b>${gb(b)}</b></div>`;
  // No bar. The machines in the topology are already gauges and now fill
  // in these colours, so a second full-width chart of the same split would
  // be the free-space bar's mistake again. This is the key to that picture,
  // and the key carries the numbers.
  el.innerHTML=`<div class="ram">
    ${by.map(([k,b])=>row(k,b,RAMCOL[k]||'var(--dim)')+
      (k==='knurlogic'&&m.knurlogic_cache>0
        ? `<div class="ramrow sub"><em class="hatch" style="--c:${RAMCOL.knurlogic}"></em>
            <span>of which cache</span><b>${gb(m.knurlogic_cache)}</b></div>`:'')).join('')}
    ${row('everything else',other,'var(--faint)')}
    ${row('unused',free,'')}</div>`;
}

async function act(payload){
  const r=await fetch('/loaded.json',{method:'POST',
    body:JSON.stringify(payload)});
  const j=await r.json();
  // A refusal is an answer, and the page has to say it the way the MCP does
  // -- a Launch button that quietly resets is the page's version of an agent
  // waiting on silence.
  if(j.error) alert(j.error);
  else if(j.refused) alert(refusalText(j));
  await loadResident();
  return j;
}
function refusalText(j){
  const L=['Not loaded: '+j.refused];
  const bl=[...(j.blockers||[]),...(j.detail&&Array.isArray(j.detail)?j.detail:[])];
  bl.forEach(b=>L.push('  - '+b.what+(b.detail&&b.detail.phase?' ('+b.detail.phase+')':'')));
  const d=(j.detail&&!Array.isArray(j.detail))?j.detail:{};
  if(d.short_by_gib) L.push(`  needs ${d.model_gib} GiB, ${d.available_gib_total} free: `+
                            `${d.short_by_gib} GiB short`);
  (j.nodes||[]).filter(n=>!n.fits).forEach(n=>
    L.push(`  - ${n.node}: shard ${n.gib} GiB, ${n.available_gib} free`));
  if((j.holding_memory||[]).length){ L.push('','Holding memory now:');
    j.holding_memory.forEach(h=>L.push(`  - ${h.what} (${h.where}, ${h.phase})`)) }
  if(j.note) L.push('',j.note);
  return L.join('\n');
}
async function loadResident(){
  let d; try{ d=await (await fetch('/loaded.json')).json() }catch(e){ return }
  const rows=d.resident||[], el=$('resident');
  if(!rows.length){
    el.innerHTML='<div class="card offered"><div class="cardhd">'+
      '<span class="dot"></span><span class="n">nothing loaded</span>'+
      '</div></div>';
    return;
  }
  el.innerHTML=rows.map((r,i)=>`<div class="card ${esc(r.state)}">
      <div class="cardhd">
        <span class="dot"></span>
        <span class="rt ${esc(r.runtime)}">${esc(r.runtime)}</span>
        <span class="grow"></span>
        ${r.can_unload?`<button class="mini danger" data-i="${i}"
          >Unload</button>`:''}
      </div>
      <div class="n" title="click to chat with it" data-chatn="${i}"
        style="cursor:pointer">${esc(r.name)}</div>
      <div class="s">${[
        r.bytes_resident?gb(r.bytes_resident)
          :(r.state==='offered'?'':'size not reported'),
        r.detail, r.state==='loaded'?'':r.state]
        .filter(Boolean).filter((v,i,x)=>x.indexOf(v)===i)
        .map(esc).join(' · ')}</div>
    </div>`).join('');
  el.querySelectorAll('[data-chatn]').forEach(x=>x.onclick=()=>{
    const r=rows[+x.dataset.chatn];
    if(window.switchTab) window.switchTab('chat');
    if(window.newChat) window.newChat(r.name, r.where, window.visionOf(r.name));
  });
  // Only when status has told us nothing: in a cluster the key is the sum
  // of what the machines are drawing, and this document is one box.
  // NOT a second writer for the key. `tick` renders it from the node maps
  // the machines are drawn from; this document is a different sample of the
  // same box, and letting both write produced a key that disagreed with the
  // gauge beside it. Only used when status supplied nothing at all.
  if(!RAM) ramWent(d.memory||{});
  el.querySelectorAll('.cardhd button').forEach(x=>x.onclick=async()=>{
    const r=rows[+x.dataset.i];
    const how={knurlogic:'unload', exo:'exo-unload', ollama:'ollama-unload'};
    x.textContent='…'; x.disabled=true;
    await act({action:how[r.runtime], target:r.ident, where:r.where});
  });
}

tick().then(loadModels).then(loadResident);
loadSettings({}); setInterval(tick,2000); setInterval(loadResident,5000);

// --- try it, which is really "measure it" ---------------------------------
// This panel is a bench, not a chat window. The reason to send a prompt here
// is to turn a knob and send it again, so every reply carries three numbers:
//
//   TTFT        wall time to the first token. What a harness feels as lag.
//   prefill     tokens/s through the prompt -- the phase the memory knobs
//               actually govern, and the one that spikes.
//   decode      tokens/s after the first token.
//
// Measuring prefill at all requires STREAMING (a non-streaming call cannot
// tell you when the first token appeared) plus `stream_options.include_usage`,
// which is how mlx-lm reports the token counts.
//
// THE TRAP, and it would have made this instrument lie: `prompt_tokens`
// includes tokens served from the prompt cache, which were never prefilled.
// Send the same prompt twice while turning a knob -- exactly what this panel
// is for -- and the second run divides a full prompt by a near-zero prefill
// time. So the rate uses prompt_tokens MINUS cached_tokens, and when that is
// zero the rate is not shown at all: there is nothing to have a rate of.
const log=$('log');
function say(who,t){const p=document.createElement('p');p.innerHTML=`<b>${who}</b> `;
  p.appendChild(document.createTextNode(t));log.appendChild(p);log.scrollTop=1e9;return p}

// The point of running twice is the difference, so the page draws the
// difference. A line telling you to compare the two numbers is a line
// doing work the numbers should be doing themselves.
//
// Only against the run above it, and only when that run measured the same
// thing: a delta against a different prompt is not a delta.
// One sample per arm cannot support a small difference, so anything under
// 5% reads as "=" rather than as a change. Drawing a 2% wobble with an arrow
// on it is the same error as quoting a speed claim from a single run.
function delta(now, was){
  if(!(now>0&&was>0)) return '';
  const pc=100*(now-was)/was;
  if(Math.abs(pc)<5) return '<i class="d flat">=</i>';
  return `<i class="d ${pc>0?'up':'down'}">${pc>0?'▲':'▼'}${
    Math.abs(pc).toFixed(0)}%</i>`;
}
function metHTML(m, prev){
  if(!m) return '';
  const same=prev && prev.prompt===m.prompt;
  const bit=(k,v,warn)=>`<span class="${warn?'warnv':''}">${k} <b>${v}</b></span>`;
  let h=bit('ttft', m.ttft_ms<1000?`${Math.round(m.ttft_ms)} ms`
                                  :`${(m.ttft_ms/1000).toFixed(2)} s`);
  if(m.prefill_tps) h+=bit('prefill', `${Math.round(m.prefill_tps)} tok/s`+
    (same?delta(m.prefill_tps, prev.prefill_tps):''));
  if(m.decode_tps) h+=bit('decode', `${m.decode_tps.toFixed(1)} tok/s`+
    (same?delta(m.decode_tps, prev.decode_tps):''));
  // Prefill is the rate of NEW prefill either way -- cached tokens are
  // already out of it -- so a cache hit is a smaller sample, not a wrong
  // number. Shown because it explains a thin measurement, not warned about.
  if(m.prompt) h+=bit('prompt', m.cached?`${m.prompt-m.cached} new of ${m.prompt}`
                                        :String(m.prompt));
  if(m.completion) h+=bit('out', String(m.completion));
  return `<div class="met">${h}</div>`;
}
function showMet(afterEl, m, prev){
  const d=document.createElement('div');
  d.innerHTML=metHTML(m, prev); const el=d.firstElementChild;
  if(el){ afterEl.after(el); log.scrollTop=1e9 }
}

  const r=RUNS.find(x=>x.id===CUR);
  return r ? (r.msgs||[]).map(x=>x.met).filter(Boolean).pop() : null;
}

// --- chat memory ----------------------------------------------------------

  catch(e){} }

  // tuned, not the time of day.

  if(!m) return run.tune||'';

// --- the timed request ----------------------------------------------------
// Enter sends, explicitly. A form with one text input and a submit button
// implicitly submits on Enter, and that is exactly the kind of "should work"
// worth nailing down on the one control the whole panel exists to use.
// Disabling the button does not stop implicit submission either, so the
// in-flight guard is here rather than on the button.
let BUSY=false;
$('q').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){
    e.preventDefault(); $('f').requestSubmit();
  }
});
// "fresh prefill" is NOT a cache off-switch, and calling it one would be a
// claim this server cannot honour: mlx-lm has no per-request option for it
// (checked -- the body options are stream/temperature/penalties and no
// more), only the `--prompt-cache-size` flag it was started with. What it
// has is a PREFIX TRIE: a cached entry is reused only for a shared leading
// token run. So a unique marker at the FRONT of the prompt leaves nothing to
// share, and the prompt is genuinely pushed through the model again.
//
// It cannot reach zero cached tokens and does not pretend to -- the chat
// template's own preamble sits ahead of anything we write and stays shared.
// That is why the rate subtracts `cached_tokens` regardless of this box: the
// checkbox makes the measurement BIG, the subtraction makes it HONEST, and
// the two are independent.
let LAST='';
function withNonce(q){
  return $('fresh').checked
    ? `[bench ${Math.random().toString(36).slice(2,8)}] ${q}` : q;
}
$('again').onclick=()=>{ if(LAST && !BUSY) send(LAST) };

async function send(q){
  if(BUSY||!q) return;
  BUSY=true; LAST=q; $('again').disabled=true;
  const prev=lastMet();
  $('q').value=''; say('you',q); record('user',q,null);
  const out=say('it','…'); $('go').disabled=true;
  const sent=withNonce(q);
  const t0=performance.now();
  let first=0, text='', usage=null;
  try{
    const r=await fetch('/v1/chat/completions',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:[{role:'user',content:sent}],max_tokens:256,
        stream:true, stream_options:{include_usage:true}})});
    if(!r.ok||!r.body) throw new Error('HTTP '+r.status);
    const rd=r.body.getReader(), dec=new TextDecoder();
    let buf='';
    for(;;){
      const {value,done}=await rd.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      let nl;
      while((nl=buf.indexOf('\n'))>=0){
        const line=buf.slice(0,nl).trim(); buf=buf.slice(nl+1);
        if(!line.startsWith('data:')) continue;
        const payload=line.slice(5).trim();
        if(payload==='[DONE]') continue;
        let j; try{ j=JSON.parse(payload) }catch(err){ continue }
        if(j.usage) usage=j.usage;
        const piece=j.choices?.[0]?.delta?.content;
        if(piece){
          if(!first) first=performance.now();
          text+=piece; out.lastChild.textContent=text; log.scrollTop=1e9;
        }
      }
    }
    const end=performance.now();
    let met=null;
    if(first){
      const ttft=first-t0;
      const prompt=usage?.prompt_tokens||0;
      const cached=usage?.prompt_tokens_details?.cached_tokens||0;
      const fresh=Math.max(prompt-cached,0);
      const comp=usage?.completion_tokens||0;
      met={ttft_ms:ttft, prompt, cached, completion:comp, fresh:$('fresh').checked,
           // Only tokens actually pushed through the model count toward a
           // prefill rate, and only when there were any.
           prefill_tps: fresh>0 ? fresh/(ttft/1000) : 0,
           decode_tps: (comp>1 && end>first) ? (comp-1)/((end-first)/1000) : 0};
    }
    if(!text) out.lastChild.textContent='(no content)';
    showMet(out, met, prev);
    record('assistant', text||'(no content)', met);
  }catch(err){ out.lastChild.textContent=String(err);
    record('assistant',String(err),null) }
  BUSY=false; $('go').disabled=false; $('again').disabled=!LAST;
}
$('f').onsubmit=e=>{ e.preventDefault(); send($('q').value.trim()) };

// --- IndexedDB image store ----------------------------------------------
// Images are content-addressed by the SHA-256 of the FINAL data URL (the
// one downscaled/re-encoded once at attach time -- §3.2/3.4). Kept out of
// localStorage on purpose: exo's own store keeps images inline as data URLs
// there and just logs the quota error (`app.svelte.ts:669`); a few
// screenshots would blow past 5 MB in a couple of turns.
let IDB=null, IDBFAIL=false;
function openIDB(){
  return new Promise((res)=>{
    if(IDB){ res(IDB); return }
    if(IDBFAIL || !window.indexedDB){ res(null); return }
    try{
      const rq=indexedDB.open('kn-img', 1);
      rq.onupgradeneeded=()=>{ rq.result.createObjectStore('blobs', {keyPath:'hash'}) };
      rq.onsuccess=()=>{ IDB=rq.result; res(IDB) };
      rq.onerror=()=>{ IDBFAIL=true; res(null) };
    }catch(e){ IDBFAIL=true; res(null) }
  });
}
const MEMIMG={}; // session-only fallback when IndexedDB is unavailable
async function idbPut(rec){
  const db=await openIDB();
  if(!db){ MEMIMG[rec.hash]=rec; return }
  try{ await new Promise((res,rej)=>{
    const tx=db.transaction('blobs','readwrite');
    tx.objectStore('blobs').put(rec);
    tx.oncomplete=res; tx.onerror=()=>rej(tx.error);
  }) }catch(e){ MEMIMG[rec.hash]=rec }
}
async function idbGet(hash){
  const db=await openIDB();
  if(!db) return MEMIMG[hash]||null;
  try{ return await new Promise((res,rej)=>{
    const tx=db.transaction('blobs','readonly');
    const rq=tx.objectStore('blobs').get(hash);
    rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error);
  }) }catch(e){ return MEMIMG[hash]||null }
}
async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

// --- attachments ------------------------------------------------------
// Pending attachments for the message being composed. Images are downscaled
// and re-encoded exactly ONCE, here, at attach time -- never again -- which
// is what lets every resend be byte-identical and hit the server's cache
// (report-chat-ui.md §0.4, §3.4).
const MAXEDGE=1536, THUMBEDGE=160;
let PENDING=[]; // [{kind,name,hash,mime,w,h,bytes,text?}]

function clearAttachments(){ PENDING=[]; renderChips() }
function renderChips(){
  const el=$('chips');
  el.innerHTML=PENDING.map((a,i)=>{
    if(a.kind==='image'){
      return `<div class="chip"><img src="${a.thumb}"><span>${esc(a.name)}</span>
        <span class="ctok">≈${estTokens(a)} tok</span>
        <span class="cx" data-rm="${i}">×</span></div>`;
    }
    return `<div class="chip"><span>📄 ${esc(a.name)}</span>
      <span class="cx" data-rm="${i}">×</span></div>`;
  }).join('');
  el.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>{
    PENDING.splice(+x.dataset.rm,1); renderChips();
  });
}
// A rough patch-count estimate (√-area / 28px patches, no family-specific
// merge factor -- the real number comes back in `usage` after the send;
// this is only for the chip, per §3.5). Not verified per family.
function estTokens(a){ return Math.max(64, Math.round((a.w*a.h)/(28*28))) }

function loadImage(dataURL){
  return new Promise((res,rej)=>{
    const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=dataURL;
  });
}
function fileToDataURL(f){
  return new Promise((res,rej)=>{
    const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f);
  });
}
async function attachImage(file){
  const raw=await fileToDataURL(file);
  const im=await loadImage(raw);
  const scale=Math.min(1, MAXEDGE/Math.max(im.width, im.height));
  const w=Math.max(1,Math.round(im.width*scale)), h=Math.max(1,Math.round(im.height*scale));
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  cv.getContext('2d').drawImage(im, 0, 0, w, h);
  const mime = file.type==='image/png' ? 'image/png' : 'image/jpeg';
  const dataURL=cv.toDataURL(mime, 0.85);
  const hash=await sha256(dataURL);
  const tcv=document.createElement('canvas');
  const ts=Math.min(1, THUMBEDGE/Math.max(w,h));
  tcv.width=Math.max(1,Math.round(w*ts)); tcv.height=Math.max(1,Math.round(h*ts));
  tcv.getContext('2d').drawImage(cv, 0, 0, tcv.width, tcv.height);
  const thumb=tcv.toDataURL('image/jpeg', 0.7);
  await idbPut({hash, dataURL, thumbDataURL:thumb, w, h, bytes:dataURL.length});
  PENDING.push({kind:'image', name:file.name, hash, mime, w, h,
                bytes:dataURL.length, thumb});
  renderChips();
}
async function attachText(file){
  const text=await file.text();
  PENDING.push({kind:'text', name:file.name, text:text.slice(0,100000)});
  renderChips();
}
async function handleFiles(files){
  for(const f of files){
    try{
      if(f.type.startsWith('image/')) await attachImage(f);
      else if(f.type==='application/pdf' || /\.pdf$/i.test(f.name)){
        // PDFs left out (per the task's instruction): rendering them to page
        // images needs pdf.js, and a quick check of a simple lazy import
        // from jsdelivr did not fit this session's time budget cleanly
        // alongside everything else this file owns -- see build report.
        alert(`${f.name}: PDF attachments are not supported yet. `+
          `Convert it to images first, or paste its text.`);
      } else await attachText(f);
    }catch(e){ alert(`Could not attach ${f.name}: ${e}`) }
  }
}

$('cattach').onclick=()=>$('cfile').click();
$('chat').addEventListener('dragover', e=>e.preventDefault());
