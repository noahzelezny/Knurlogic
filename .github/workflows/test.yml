name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # mlx needs Apple Silicon: macos-14 and later runners are arm64.
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy
      # Tests that need real weights, a second Mac or a Thunderbolt link
      # skip themselves.
      - run: python -m pytest -q tests
