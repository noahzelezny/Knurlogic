# Publish to PyPI when a version tag is pushed (v0.1.0 -> knurlogic 0.1.0).
#
# Trusted Publishing: PyPI trusts this workflow, in this repository, in the
# `pypi` environment, to upload -- so no API token exists anywhere to leak.
# On pypi.org the project's publisher names: owner noahzelezny, repository
# Knurlogic, workflow publish.yml, environment pypi.
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The tag is the version in pyproject.toml
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$want" = "$got" || { echo "tag $GITHUB_REF_NAME, pyproject $got"; exit 1; }
      - name: No machine-specific strings in the release
        run: python scripts/check_machine_specifics.py --tree
      # The package is pure Python (mlx is a dependency, not built here),
      # so one wheel from Linux serves every Mac.
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
